<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>منصة الألعاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>

<style>
  :root{
    --bg:#0d0b22;
    --surface:#1c1a2c;
    --surface-2:#26243590;
    --accent:#7c6cf0;
    --accent-2:#ff4d6d;
    --text:#f5f1e8;
    --text-dim:#a8a3b8;
    --green:#00d09c;
    --mafia:#e74c3c;
    --police:#3b82f6;
    --doctor:#5fd0c5;
    --citizen:#f4c542;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; touch-action:manipulation;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% -10%, rgba(124,108,240,.20), transparent 50%),
      radial-gradient(circle at 90% 10%, rgba(255,77,109,.12), transparent 45%),
      var(--bg);
    color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}

  .brand{ text-align:center; padding:18px 0 4px; font-size:15px; color:var(--text-dim); letter-spacing:.3px; }
  .brand b{color:var(--accent); font-family:'Cairo',sans-serif;}

  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .stage, .card{ animation:fadeIn .28s ease; }

  .btn{
    font-family:'Cairo',sans-serif; font-weight:800; font-size:16px;
    border:none; border-radius:14px; padding:13px 26px; cursor:pointer;
    color:#fff; background:linear-gradient(135deg,var(--accent),#5b4bd6);
    box-shadow:0 6px 0 #40348f, 0 10px 24px rgba(124,108,240,.25);
    transition:transform .08s ease, filter .15s ease; margin:6px;
  }
  .btn:hover:not(:disabled){ filter:brightness(1.08); }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #40348f;}
  .btn:disabled{ background:#4a4658; color:#87829a; box-shadow:0 6px 0 #322f3d; cursor:default; }
  .btn-ghost{ background:transparent; box-shadow:none; border:2px solid #3a3650; font-size:13px; padding:8px 16px; }

  input[type=text]{
    font-family:'Tajawal',sans-serif; font-size:18px; padding:14px 16px;
    border-radius:12px; border:2px solid #3a3650; background:#100f17;
    color:var(--text); width:100%; outline:none; text-align:center;
  }
  input[type=text]:focus{ border-color:var(--accent); }

  .games-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; width:100%; max-width:640px; margin-top:18px; }
  .game-card{ background:var(--surface); border:2px solid #322f47; border-radius:18px; padding:20px 10px; text-align:center; cursor:pointer; transition:all .18s ease; box-shadow:0 8px 20px rgba(0,0,0,.25); }
  .game-card.disabled{ opacity:.5; cursor:not-allowed; }
  .game-card:hover:not(.disabled){ border-color:var(--accent); transform:translateY(-4px); box-shadow:0 14px 28px rgba(124,108,240,.25); }
  .game-card.selected{ border-color:var(--green); background:rgba(0,208,156,.1); }
  .game-icon-badge{ width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 10px; background:var(--surface-2); }
  .game-title{ font-family:'Cairo',sans-serif; font-size:15px; font-weight:700; margin-bottom:4px; }
  .vote-badge{ background:var(--accent); color:#fff; font-size:12px; font-weight:bold; padding:3px 10px; border-radius:20px; display:inline-block; margin-top:8px; }
  .coming-soon{ color:var(--accent-2); font-size:12px; font-weight:bold; margin-top:8px; }

  .stage{ flex:1; display:flex; flex-direction:column; align-items:center; padding:20px 16px 40px; text-align:center; width:100%; }
  .code-box{ background:var(--surface); border-radius:20px; padding:14px 30px; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .room-code{ font-family:'Cairo',sans-serif; font-weight:900; font-size:44px; letter-spacing:10px; color:var(--accent); text-shadow:0 0 30px rgba(124,108,240,.55); margin:2px 0; }
  .join-row{ margin-top:18px; display:flex; gap:18px; align-items:center; justify-content:center; flex-wrap:wrap; background:var(--surface); padding:14px 18px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.25); }
  #qr{ background:#fff; padding:8px; border-radius:10px; line-height:0; }
  .link-text{ direction:ltr; font-size:12px; color:var(--text-dim); word-break:break-all; max-width:220px; text-align:left; }
  .players-box{ margin-top:26px; width:100%; max-width:640px; }
  .chip{ background:var(--surface); border:1px solid #3a3650; padding:8px 16px; border-radius:999px; font-weight:700; display:inline-block; margin:5px; font-size:14px; }
  .chip.dead{ opacity:.45; text-decoration:line-through; }
  .narrator{ font-size:17px; line-height:1.7; max-width:540px; margin:10px auto; }
  .top-bar{ position:absolute; top:10px; left:10px; }

  .phone{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  .card{ background:var(--surface); border-radius:22px; padding:26px 22px; width:100%; max-width:420px; text-align:center; box-shadow:0 14px 34px rgba(0,0,0,.35); }
  .muted{ color:var(--text-dim); font-size:14px; margin-top:10px; }

  .role-card{ border-radius:20px; padding:28px 20px; margin-bottom:14px; }
  .role-icon{ font-size:56px; }
  .role-name{ font-family:'Cairo',sans-serif; font-weight:900; font-size:26px; margin:8px 0; }
  .role-desc{ font-size:14px; opacity:.9; }
  .role-mafia{ background:linear-gradient(160deg,var(--mafia),#7f1d1d); }
  .role-police{ background:linear-gradient(160deg,var(--police),#1e3a8a); }
  .role-doctor{ background:linear-gradient(160deg,var(--doctor),#0f766e); color:#0b1120; }
  .role-citizen{ background:linear-gradient(160deg,var(--citizen),#92600a); color:#241a02; }

  .target-list{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .target-btn{ font-family:'Tajawal',sans-serif; font-size:16px; font-weight:700; padding:13px; border-radius:12px; border:2px solid #3a3650; background:#100f17; color:var(--text); cursor:pointer; }
  .target-btn.picked{ border-color:var(--green); background:rgba(0,208,156,.12); }
  .target-btn:disabled{ opacity:.5; cursor:not-allowed; }

  .draw-layout{ display:flex; gap:20px; width:100%; max-width:920px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  .canvas-wrap{ background:#fff; border-radius:16px; padding:6px; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  #hostCanvas{ display:block; border-radius:10px; }
  .guess-feed{ background:var(--surface); border-radius:16px; padding:14px; width:260px; max-height:400px; overflow-y:auto; text-align:right; box-shadow:0 10px 30px rgba(0,0,0,.25); }
  .guess-line{ padding:6px 0; border-bottom:1px solid #3a3650; font-size:14px; }
  .guess-line.correct{ color:var(--green); font-weight:700; }
  .guess-feed-mini{ margin-top:14px; max-height:150px; overflow-y:auto; text-align:right; }
  .color-row button{ box-shadow:0 2px 6px rgba(0,0,0,.4); }
</style>
</head>
<body>

<script>
/* =========================================================
   1) إعدادات Firebase
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBwU4coCgrk1kkzQUfj2vFh5kzoUlFzDnY",
  authDomain: "game-platform-v1.firebaseapp.com",
  databaseURL: "https://game-platform-v1-default-rtdb.firebaseio.com",
  projectId: "game-platform-v1",
  storageBucket: "game-platform-v1.firebasestorage.app",
  messagingSenderId: "1060382508222",
  appId: "1:1060382508222:web:b009f33dba05559806caef",
  measurementId: "G-0BR4SRYKH4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const app = document.getElementById('app');

const GAMES_LIST = [
  { id: 'mafia',   title: 'من هم المافيا؟', icon: '🕵️', available: true },
  { id: 'draw',    title: 'ارسم وخمن',      icon: '🎨', available: true },
  { id: 'clicker', title: 'أسرع ضغطة',      icon: '⚡', available: false },
  { id: 'trivia',  title: 'أسئلة وتحديات',  icon: '🧠', available: false }
];
const ROLE_META = {
  mafia:   { name:'مافيا',  icon:'🔪', cls:'role-mafia',   desc:'تعرف على زملائك بالمافيا. كل ليلة تختارون معًا ضحية.' },
  police:  { name:'شرطي',   icon:'👮', cls:'role-police',  desc:'كل ليلة تحقق من شخص لتعرف إن كان مافيا.' },
  doctor:  { name:'طبيب',   icon:'⚕️', cls:'role-doctor',  desc:'كل ليلة تحمي شخصًا واحدًا من القتل.' },
  citizen: { name:'مواطن',  icon:'🙂', cls:'role-citizen', desc:'ناقش، استنتج، وصوّت بذكاء لكشف المافيا.' }
};
const DRAW_WORDS = ['تفاحة','شمس','قطة','كلب','سيارة','بيت','شجرة','كرة','ساعة','مظلة','ثلاجة','هاتف','نظارة','سمكة','طائرة','جبل','نجمة','قلب','وردة','حذاء','مفتاح','كتاب','قلم','كرسي','باب','نافذة','قمر','سحابة','مروحة','دراجة','قهوة','بيتزا','موزة','بطة','فيل','أسد','ثعبان','عنكبوت','مصباح','تلفاز'];

function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function makeRoomCode(){ return String(Math.floor(1000 + Math.random()*9000)); }
function joinUrl(code){ return location.origin + location.pathname + '?room=' + code; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normalizeAr(s){
  return String(s).trim().toLowerCase()
    .replace(/[\u064B-\u065F\u0610-\u061A\u06D6-\u06ED]/g,'')
    .replace(/[إأآا]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
    .replace(/\s+/g,'');
}
function pickWordOptions(){ return shuffle(DRAW_WORDS).slice(0,3); }

const params = new URLSearchParams(location.search);
const roomParam = params.get('room');
if (!roomParam) { renderHost(); } else { renderPlayer(roomParam.trim()); }

/* ================= HOST ================= */
function renderHost(){
  const savedCode = localStorage.getItem('hostRoomCode');
  if (savedCode) {
    db.ref('rooms/' + savedCode).once('value', snap => {
      if (snap.exists()) initHostRoom(savedCode, false);
      else { localStorage.removeItem('hostRoomCode'); initHostRoom(makeRoomCode(), true); }
    });
  } else {
    initHostRoom(makeRoomCode(), true);
  }
}

function initHostRoom(code, isNew){
  localStorage.setItem('hostRoomCode', code);
  const roomRef = db.ref('rooms/' + code);
  if (isNew) roomRef.set({ status:'voting', players:{}, votes:{}, activeGame:null });

  app.innerHTML = `
    <button class="btn btn-ghost top-bar" id="newRoomBtn">غرفة جديدة</button>
    <div class="brand">🎮 منصة <b>الألعاب</b></div>
    <div class="stage" id="stage"></div>
  `;
  document.getElementById('newRoomBtn').onclick = () => {
    if (confirm('سيتم إنشاء غرفة جديدة وفقدان الاتصال باللاعبين الحاليين. متابعة؟')) {
      localStorage.removeItem('hostRoomCode');
      location.reload();
    }
  };

  roomRef.on('value', snap => {
    const room = snap.val();
    if (!room) return;
    if (room.status === 'voting') renderHostLobby(code, room);
    else if (room.status === 'in_game' && room.activeGame === 'mafia') renderMafiaHost(code, room);
    else if (room.status === 'in_game' && room.activeGame === 'draw') renderDrawHost(code, room);
    else renderHostGenericPlaceholder(code, room);
  });
}

function renderHostLobby(code, room){
  const players = room.players || {};
  const votes = room.votes || {};
  const tally = {};
  Object.values(votes).forEach(g => tally[g] = (tally[g]||0)+1);

  const cardsHtml = GAMES_LIST.map(g => {
    const v = tally[g.id] || 0;
    if (g.available) {
      return `
        <div class="game-card">
          <div class="game-icon-badge">${g.icon}</div>
          <div class="game-title">${g.title}</div>
          <div class="vote-badge">${v} صوت</div>
          <button class="btn" style="padding:6px 12px; font-size:13px; width:100%;" onclick="startGame('${g.id}','${code}')">ابدأ اللعبة</button>
        </div>`;
    }
    return `
      <div class="game-card disabled">
        <div class="game-icon-badge">${g.icon}</div>
        <div class="game-title">${g.title}</div>
        <div class="coming-soon">قريبًا</div>
      </div>`;
  }).join('');

  document.getElementById('stage').innerHTML = `
    <p style="margin:0; color:var(--text-dim);">رمز الغرفة</p>
    <div class="code-box"><p class="room-code">${code}</p></div>
    <div class="join-row">
      <div id="qr"></div>
      <div>
        <div class="link-text">${joinUrl(code)}</div>
        <button class="btn btn-ghost" id="copyBtn">نسخ الرابط</button>
      </div>
    </div>
    <div class="players-box">
      <h3 style="font-family:'Cairo';">اللاعبون (${Object.keys(players).length})</h3>
      <div>${Object.values(players).map(p=>`<span class="chip">${escapeHtml(p.name)}</span>`).join('') || '<span class="muted">بانتظار انضمام اللاعبين…</span>'}</div>
    </div>
    <div class="players-box">
      <h3 style="font-family:'Cairo';">الألعاب المتاحة للتصويت</h3>
      <div class="games-grid">${cardsHtml}</div>
    </div>
  `;
  new QRCode(document.getElementById('qr'), { text: joinUrl(code), width:120, height:120 });
  document.getElementById('copyBtn').onclick = () => {
    navigator.clipboard.writeText(joinUrl(code)).then(()=>{
      document.getElementById('copyBtn').textContent = 'تم النسخ ✓';
    });
  };
}

function renderHostGenericPlaceholder(code, room){
  const g = GAMES_LIST.find(x=>x.id===room.activeGame);
  document.getElementById('stage').innerHTML = `
    <h2 style="font-family:'Cairo'; color:var(--accent);">🎮 ${g ? g.title : ''}</h2>
    <p class="muted">هذه اللعبة قيد التطوير حاليًا.</p>
    <button class="btn" onclick="resetToLobby('${code}')">رجوع لقائمة الألعاب</button>
  `;
}

window.startGame = function(gameId, code){
  if (gameId === 'mafia') { startMafiaGame(code); return; }
  if (gameId === 'draw') { startDrawGame(code); return; }
  db.ref('rooms/'+code).update({ status:'in_game', activeGame: gameId });
};
window.resetToLobby = function(code){
  db.ref('rooms/'+code).update({ status:'voting', activeGame:null, votes:{}, mafia:null, draw:null });
  db.ref('strokes/'+code).set(null);
};

/* ================= MAFIA — game logic ================= */
function assignMafiaRoles(ids){
  const n = ids.length;
  const shuffled = shuffle(ids);
  const mafiaCount = Math.max(1, Math.floor(n/4));
  const roles = {};
  let i = 0;
  for (let k=0;k<mafiaCount;k++) roles[shuffled[i++]] = 'mafia';
  if (n>=5) roles[shuffled[i++]] = 'police';
  if (n>=6) roles[shuffled[i++]] = 'doctor';
  while (i<n) roles[shuffled[i++]] = 'citizen';
  return roles;
}

window.startMafiaGame = function(code){
  const roomRef = db.ref('rooms/'+code);
  roomRef.child('players').once('value', snap => {
    const players = snap.val() || {};
    const ids = Object.keys(players);
    if (ids.length < 4) { alert('تحتاج 4 لاعبين على الأقل لبدء لعبة المافيا'); return; }
    const roles = assignMafiaRoles(ids);
    const alive = {}; ids.forEach(id => alive[id] = true);
    roomRef.update({
      status:'in_game', activeGame:'mafia',
      mafia:{ phase:'role_reveal', roles, alive, round:1,
        nightVotes:{}, policeResults:{}, dayVotes:{},
        lastNightVictim:null, lastDayEliminated:null, winner:null }
    });
  });
};

window.mafiaNext = function(code, action){
  const mRef = db.ref('rooms/'+code+'/mafia');
  mRef.once('value', snap => {
    const m = snap.val(); if (!m) return;
    if (action==='to_police') mRef.update({ phase:'night_police' });
    else if (action==='to_doctor') mRef.update({ phase:'night_doctor' });
    else if (action==='to_night') mRef.update({ phase:'night_mafia' });
    else if (action==='reveal'){
      const mVotes = (m.nightVotes && m.nightVotes.mafia) || {};
      const tally = {};
      Object.values(mVotes).forEach(t => tally[t]=(tally[t]||0)+1);
      let victim=null, max=0;
      Object.entries(tally).forEach(([id,c]) => { if (c>max){max=c; victim=id;} });
      const protectedId = m.nightVotes && m.nightVotes.doctorTarget;
      const alive = {...m.alive};
      let died = null;
      if (victim && victim !== protectedId) { alive[victim]=false; died=victim; }
      mRef.update({ alive, lastNightVictim: died, phase:'reveal' }).then(()=>checkMafiaWin(code));
    }
    else if (action==='to_discussion') mRef.update({ phase:'discussion' });
    else if (action==='to_voting') mRef.update({ phase:'voting', dayVotes:{} });
    else if (action==='reveal_vote'){
      const dv = m.dayVotes || {};
      const tally = {};
      Object.values(dv).forEach(t => { if (t!=='abstain') tally[t]=(tally[t]||0)+1; });
      let top=null, max=0, tie=false;
      Object.entries(tally).forEach(([id,c]) => {
        if (c>max){ max=c; top=id; tie=false; } else if (c===max){ tie=true; }
      });
      const alive = {...m.alive};
      let eliminated=null;
      if (top && !tie) { alive[top]=false; eliminated=top; }
      mRef.update({ alive, lastDayEliminated: eliminated, phase:'vote_reveal' }).then(()=>checkMafiaWin(code));
    }
    else if (action==='to_next_round') mRef.update({ phase:'night_mafia', round:(m.round||1)+1, nightVotes:{} });
  });
};

function checkMafiaWin(code){
  const mRef = db.ref('rooms/'+code+'/mafia');
  mRef.once('value', snap => {
    const m = snap.val(); if (!m) return;
    const aliveIds = Object.keys(m.alive).filter(id=>m.alive[id]);
    const aliveMafia = aliveIds.filter(id=>m.roles[id]==='mafia').length;
    const aliveOthers = aliveIds.length - aliveMafia;
    if (aliveMafia===0) mRef.update({ phase:'ended', winner:'citizens' });
    else if (aliveMafia>=aliveOthers) mRef.update({ phase:'ended', winner:'mafia' });
  });
}

window.mafiaVote = function(code, myId, targetId){ db.ref('rooms/'+code+'/mafia/nightVotes/mafia/'+myId).set(targetId); };
window.doctorProtect = function(code, targetId){ db.ref('rooms/'+code+'/mafia/nightVotes/doctorTarget').set(targetId); };
window.dayVote = function(code, myId, targetId){ db.ref('rooms/'+code+'/mafia/dayVotes/'+myId).set(targetId); };
window.policeInvestigate = function(code, myId, targetId){
  const mRef = db.ref('rooms/'+code+'/mafia');
  mRef.once('value', snap => {
    const m = snap.val();
    const isMafia = m.roles[targetId] === 'mafia';
    mRef.child('policeResults/'+myId).set({ targetId, isMafia, round: m.round });
  });
};

/* ---- Mafia: host view ---- */
function renderMafiaHost(code, room){
  const m = room.mafia; if (!m) return;
  const players = room.players || {};
  const aliveIds = Object.keys(m.alive||{}).filter(id=>m.alive[id]);
  let narrator = '', control = '';

  if (m.phase==='role_reveal'){
    narrator = 'كل لاعب يشاهد بطاقة دوره الآن على جواله. تأكد الجميع رأوا أدوارهم.';
    control = `<button class="btn" onclick="mafiaNext('${code}','to_night')">ابدأ الجولة الأولى 🌙</button>`;
  } else if (m.phase==='night_mafia'){
    const v = Object.keys((m.nightVotes&&m.nightVotes.mafia)||{}).length;
    narrator = `الجولة ${m.round} — اطلب من الجميع إغلاق أعينهم. المافيا يختارون ضحيتهم (${v} صوّتوا).`;
    control = `<button class="btn" onclick="mafiaNext('${code}','to_police')">التالي: دور الشرطي 👮</button>`;
  } else if (m.phase==='night_police'){
    narrator = 'الشرطي يختار الآن شخصًا للتحقيق معه.';
    control = `<button class="btn" onclick="mafiaNext('${code}','to_doctor')">التالي: دور الطبيب ⚕️</button>`;
  } else if (m.phase==='night_doctor'){
    narrator = 'الطبيب يختار الآن شخصًا ليحميه.';
    control = `<button class="btn" onclick="mafiaNext('${code}','reveal')">كشف نتيجة الليل 🔦</button>`;
  } else if (m.phase==='reveal'){

/* ================= DRAW & GUESS — game logic ================= */
window.startDrawGame = function(code){
  const roomRef = db.ref('rooms/'+code);
  roomRef.child('players').once('value', snap => {
    const players = snap.val() || {};
    const ids = Object.keys(players);
    if (ids.length < 2) { alert('تحتاج لاعبين اثنين على الأقل'); return; }
    const order = shuffle(ids);
    const scores = {}; ids.forEach(id => scores[id] = 0);
    db.ref('strokes/'+code).set(null);
    roomRef.update({
      status:'in_game', activeGame:'draw',
      draw:{ phase:'choosing_word', order, turnIndex:0, drawerId: order[0],
        wordOptions: pickWordOptions(), word:null, guesses:null, scores, round:1, timerEnd:null }
    });
  });
};

window.chooseWord = function(code, word){
  db.ref('strokes/'+code).set(null);
  db.ref('rooms/'+code+'/draw').update({ word, phase:'drawing', timerEnd: Date.now()+60000, guesses:null });
};

window.endDrawRound = function(code){
  db.ref('rooms/'+code+'/draw').update({ phase:'reveal' });
};

window.nextDrawRound = function(code){
  const dRef = db.ref('rooms/'+code+'/draw');
  dRef.once('value', snap => {
    const d = snap.val(); if (!d) return;
    const nextIndex = d.turnIndex + 1;
    if (nextIndex >= d.order.length) { dRef.update({ phase:'final' }); return; }
    db.ref('strokes/'+code).set(null);
    dRef.update({
      phase:'choosing_word', turnIndex: nextIndex, drawerId: d.order[nextIndex],
      wordOptions: pickWordOptions(), word:null, guesses:null,
      round:(d.round||1)+1, timerEnd:null
    });
  });
};

window.submitGuess = function(code, myId, text){
  const dRef = db.ref('rooms/'+code+'/draw');
  dRef.once('value', snap => {
    const d = snap.val(); if (!d || d.phase!=='drawing') return;
    const already = d.guesses && Object.values(d.guesses).some(g=>g.playerId===myId && g.correct);
    if (already) return;
    const correct = normalizeAr(text) === normalizeAr(d.word);
    const key = dRef.child('guesses').push().key;
    dRef.child('guesses/'+key).set({ playerId: myId, name: CURRENT_PLAYER_NAME, text: correct ? '' : text, correct });
    if (correct){
      const scores = {...(d.scores||{})};
      scores[myId] = (scores[myId]||0) + 100;
      scores[d.drawerId] = (scores[d.drawerId]||0) + 20;
      dRef.child('scores').update(scores);
      dRef.once('value', snap2 => {
        const d2 = snap2.val();
        const others = d2.order.filter(id=>id!==d2.drawerId);
        const correctIds = new Set(Object.values(d2.guesses||{}).filter(g=>g.correct).map(g=>g.playerId));
        if (others.every(id=>correctIds.has(id))) window.endDrawRound(code);
      });
    }
  });
};

let currentColor = '#000000';
window.setDrawColor = function(c){ currentColor = c; };
window.clearCanvas = function(code){
  db.ref('strokes/'+code).set(null);
  const canvas = document.getElementById('drawCanvas');
  if (canvas) canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
};

function setupDrawCanvas(code){
  const canvas = document.getElementById('drawCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  db.ref('strokes/'+code).once('value', snap => {
    const all = snap.val() || {};
    Object.values(all).forEach(s => drawSegment(ctx, canvas, s));
  });

  let drawing = false, currentStroke = [], lastFlush = 0;
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: cx/rect.width, y: cy/rect.height };
  }
  function start(e){ e.preventDefault(); drawing = true; currentStroke = [getPos(e)]; }
  function move(e){
    if (!drawing) return; e.preventDefault();
    const p = getPos(e);
    const prev = currentStroke[currentStroke.length-1] || p;
    currentStroke.push(p);
    drawSegment(ctx, canvas, { points:[prev,p], color: currentColor, size:4 });
    const now = Date.now();
    if (now - lastFlush > 120){
      db.ref('strokes/'+code).push({ points: currentStroke.slice(), color: currentColor, size:4 });
      currentStroke = [p]; lastFlush = now;
    }
  }
  function end(){
    if (!drawing) return; drawing = false;
    if (currentStroke.length > 1) db.ref('strokes/'+code).push({ points: currentStroke.slice(), color: currentColor, size:4 });
    currentStroke = [];
  }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}

function drawSegment(ctx, canvas, s){
  if (!s || !s.points || s.points.length < 2) return;
  ctx.strokeStyle = s.color; ctx.lineWidth = s.size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  s.points.forEach((p,i) => {
    const x = p.x*canvas.width, y = p.y*canvas.height;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
}

function mirrorCanvas(code){
  const canvas = document.getElementById('hostCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const sRef = db.ref('strokes/'+code);
  sRef.off('child_added');
  sRef.on('child_added', snap => drawSegment(ctx, canvas, snap.val()));
}

let hostTimerInterval = null;
function startHostTimerWatch(code, timerEnd){
  if (hostTimerInterval) clearInterval(hostTimerInterval);
  let ended = false;
  hostTimerInterval = setInterval(() => {
    const remaining = Math.max(0, Math.ceil((timerEnd - Date.now())/1000));
    const el = document.getElementById('timerText');
    if (el) el.textContent = remaining;
    if (remaining <= 0 && !ended){ ended = true; clearInterval(hostTimerInterval); window.endDrawRound(code); }
  }, 500);
}

/* ---- Draw: host view ---- */
function renderDrawHost(code, room){
  const d = room.draw; if (!d) return;
  const players = room.players || {};
  const drawerName = players[d.drawerId]?.name || '';
  let body = '';

  if (d.phase==='choosing_word'){
    body = `<p class="narrator">🎨 ${escapeHtml(drawerName)} يختار كلمة الآن…</p>`;
  } else if (d.phase==='drawing' || d.phase==='reveal'){
    const guessesArr = Object.values(d.guesses||{});
    const feed = guessesArr.slice(-8).reverse().map(g =>
      g.correct ? `<div class="guess-line correct">✅ ${escapeHtml(g.name)} خمّن الكلمة!</div>`
                : `<div class="guess-line">${escapeHtml(g.name)}: ${escapeHtml(g.text)}</div>`
    ).join('');
    body = `
      <div class="draw-layout">
        <div class="canvas-wrap"><canvas id="hostCanvas" width="600" height="400"></canvas></div>
        <div class="guess-feed">${feed || '<p class="muted">بانتظار التخمينات…</p>'}</div>
      </div>
      ${d.phase==='drawing'
        ? `<p class="narrator">⏱️ <span id="timerText">--</span> ثانية — الرسام: ${escapeHtml(drawerName)}</p>
           <button class="btn btn-ghost" onclick="endDrawRound('${code}')">إنهاء الجولة</button>`
        : `<p class="narrator">الكلمة كانت: <b>${escapeHtml(d.word||'')}</b></p>
           <button class="btn" onclick="nextDrawRound('${code}')">${(d.turnIndex+1>=d.order.length) ? 'عرض النتيجة النهائية' : 'الجولة التالية 🎨'}</button>`}
    `;
  } else if (d.phase==='final'){
    const ranked = Object.entries(d.scores||{}).sort((a,b)=>b[1]-a[1]);
    body = `<h3 style="font-family:'Cairo';">🏆 النتائج النهائية</h3>
      <div>${ranked.map(([id,s],i)=>`<div class="chip">${i+1}. ${escapeHtml(players[id]?.name||'')} — ${s} نقطة</div>`).join('')}</div>
      <button class="btn" onclick="resetToLobby('${code}')">رجوع لقائمة الألعاب</button>`;
  }

  document.getElementById('stage').innerHTML = `
    <h2 style="font-family:'Cairo'; color:var(--accent);">ارسم وخمن 🎨</h2>
    ${body}
  `;

  if (d.phase==='drawing' || d.phase==='reveal') mirrorCanvas(code);
  if (d.phase==='drawing') startHostTimerWatch(code, d.timerEnd);
}

window.submitMyGuess = function(code, myId){
  const input = document.getElementById('guessInput');

  const text = input.value.trim();

  window.submitGuess(code, myId, text);
  input.value = '';
};

function renderPlayer(code){

    roomRef.on('value', snap => {
      const room = snap.val();
      if (!room) { app.innerHTML = `<div class="phone"><div class="card"><h2 style="font-family:'Cairo';">انتهت الغرفة</h2><p class="muted">اطلب رابطًا جديدًا من المضيف.</p></div></div>`; return; }
      if (room.status === 'voting') renderPlayerVoting(code, id, name, room);
      else if (room.status === 'in_game' && room.activeGame === 'mafia') renderMafiaPlayer(code, id, name, room);
      else if (room.status === 'in_game' && room.activeGame === 'draw') renderDrawPlayer(code, id, name, room);
      else app.innerHTML = `<div class="phone"><div class="card"><h2 style="font-family:'Cairo';">🎮 اللعبة قيد التطوير</h2><p class="muted">انظر شاشة المضيف.</p></div></div>`;
    });
  }

  if (!myId) {
    app.innerHTML = `<div class="phone"><div class="card">
      <h2 style="font-family:'Cairo';">انضم للغرفة</h2>
      <input type="text" id="nameInput" placeholder="اكتب اسمك" maxlength="15" autofocus />
      <button class="btn" id="joinBtn" style="width:100%; margin-top:15px;">دخول</button>
    </div></div>`;
    document.getElementById('joinBtn').onclick = () => {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) return;
      const newId = roomRef.child('players').push().key;
      roomRef.child('players/' + newId).set({ name });
      localStorage.setItem('player_id_' + code, newId);
      attach(newId, name);
    };
  } else {
    roomRef.child('players/' + myId).once('value', snap => {
      if (snap.exists()) attach(myId, snap.val().name);
      else { localStorage.removeItem('player_id_' + code); renderPlayer(code); }
    });
  }
}

function renderPlayerVoting(code, myId, name, room){
  const myVote = room.votes ? room.votes[myId] : null;
  const cardsHtml = GAMES_LIST.map(g => {
    if (!g.available) return `<div class="game-card disabled"><div class="game-icon-badge">${g.icon}</div><div class="game-title">${g.title}</div><div class="coming-soon">قريبًا</div></div>`;
    const sel = myVote === g.id;
    return `<div class="game-card ${sel?'selected':''}" onclick="castVote('${code}','${myId}','${g.id}')">
      <div class="game-icon-badge">${g.icon}</div><div class="game-title">${g.title}</div>
      ${sel ? '<div class="vote-badge" style="background:var(--green);">صوتك ✓</div>' : '<div class="vote-badge">صوّت</div>'}
    </div>`;
  }).join('');

  app.innerHTML = `<div class="phone"><div class="card" style="max-width:480px;">
    <h2 style="font-family:'Cairo';">أهلاً ${escapeHtml(name)} 👋</h2>
    <p class="muted">صوّت للعبة التي تريد لعبها:</p>
    <div class="games-grid">${cardsHtml}</div>
    <p class="muted">بانتظار المضيف لبدء اللعبة…</p>
  </div></div>`;
}

window.castVote = function(code, myId, gameId){ db.ref('rooms/'+code+'/votes/'+myId).set(gameId); };
</script>
</body>
</html>
