<style>
  :root{
    --bg:#0d0b22;
    --surface:#1c1a2c;
    --surface-2:#26243590;
    --accent:#7c6cf0;
    --accent-2:#ff4d6d;
    --text:#f5f1e8;
    --text-dim:#a8a3b8;
    --green:#00d09c;
    --team-a:#3b82f6;
    --team-b:#ff4d6d;
    --mafia:#e74c3c;
    --police:#3b82f6;
    --doctor:#5fd0c5;
    --citizen:#f4c542;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; touch-action:manipulation;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% -10%, rgba(124,108,240,.20), transparent 50%),
      radial-gradient(circle at 90% 10%, rgba(255,77,109,.12), transparent 45%),
      var(--bg);
    color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);

  #app{min-height:100vh; display:flex; flex-direction:column;}

  .brand{ text-align:center; padding:18px 0 4px; font-size:15px; color:var(--text-dim); letter-spacing:.3px; }
  .brand b{color:var(--accent); font-family:'Cairo',sans-serif;}

  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .stage, .card{ animation:fadeIn .28s ease; }

    font-family:'Cairo',sans-serif; font-weight:800; font-size:16px;

    color:#fff; background:linear-gradient(135deg,var(--accent),#5b4bd6);

  }
  .btn:hover:not(:disabled){ filter:brightness(1.08); }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #40348f;}
  .btn:disabled{ background:#4a4658; color:#87829a; box-shadow:0 6px 0 #322f3d; cursor:default; }
  .btn-ghost{ background:transparent; box-shadow:none; border:2px solid #3a3650; font-size:13px; padding:8px 16px; }
  .btn-danger{ background:linear-gradient(135deg, #e74c3c, #c0392b); box-shadow:0 6px 0 #962d22; }

  /* زر اختيار الفريق */
  .btn-team{ padding:10px 18px; border-radius:12px; font-family:'Cairo'; font-size:14px; border:2px solid #3a3650; background:#100f17; color:var(--text-dim); cursor:pointer; transition:all .2s ease; margin:4px; }
  .btn-team.selected-a{ background:var(--team-a); border-color:var(--team-a); color:#fff; font-weight:bold; box-shadow:0 0 12px rgba(59,130,246,.4); }

  .top-bar{ position:absolute; top:10px; left:10px; }

  .role-citizen{ background:linear-gradient(160deg,var(--citizen),#92600a); color:#241a02; }

  .target-list{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .target-btn{ font-family:'Tajawal',sans-serif; font-size:16px; font-weight:700; padding:13px; border-radius:12px; border:2px solid #3a3650; background:#100f17; color:var(--text); cursor:pointer; }

  .rules-list{ text-align:right; padding-inline-start:22px; margin:14px 0; line-height:1.9; font-size:14px; }

    margin: 18px 0;
    padding: 14px;
    background: var(--surface-2);
    border-radius: 16px;
    border: 1px solid #3a3650;
  }
</style>

/* =====================================================================
   SECTION 3 — SHARED UTILITIES
   ===================================================================== */
function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function makeRoomCode(){ return String(Math.floor(1000 + Math.random()*9000)); }
function joinUrl(code){ return location.origin + location.pathname + '?room=' + code; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pickRandomWordPair(){ return shuffle(WORD_BANK)[0]; }

function renderIllustration(wordText){
  const found = WORD_BANK.find(x => x.w === wordText);
  if (found && found.img) {
    return `<img src="${found.img}" class="illustration-img" alt="${escapeHtml(wordText)}" />`;
  }
  return `<div style="font-size:70px;">${found ? found.e : '❓'}</div>`;
}

function normalizeAr(s){
  return String(s).trim().toLowerCase()
    .replace(/[\u064B-\u065F\u0610-\u061A\u06D6-\u06ED]/g,'')
    .replace(/[إأآا]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
    .replace(/\s+/g,'');
}
function drawSegment(ctx, canvas, s){
  if (!s || !s.points || s.points.length < 2) return;
  ctx.strokeStyle = s.color; ctx.lineWidth = s.size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  s.points.forEach((p,i) => {
    const x = p.x*canvas.width, y = p.y*canvas.height;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
}
function mirrorCanvasFrom(strokeKey, canvasId){
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const sRef = db.ref('strokes/'+strokeKey);
  sRef.off('child_added');
  sRef.on('child_added', snap => drawSegment(ctx, canvas, snap.val()));
}
let hostTimerInterval = null;
function startHostTimerWatch(timerEnd){
  if (hostTimerInterval) clearInterval(hostTimerInterval);
  hostTimerInterval = setInterval(() => {
    const remaining = Math.max(0, Math.ceil((timerEnd - Date.now())/1000));
    const el = document.getElementById('timerText');
    if (el) el.textContent = remaining;
  }, 500);
}

/* =====================================================================
   SECTION 4 — GAME DETAIL / READY PANEL
   ===================================================================== */
function gameDetailHtml(game, room, code, myId, isHost){
  const votes = room.votes || {};
  const players = room.players || {};
  const readyIds = Object.keys(votes).filter(id => votes[id] === game.id);
  const readyNames = readyIds.map(id => players[id]?.name).filter(Boolean);
  const iAmReady = myId && votes[myId] === game.id;
  const totalPlayers = Object.keys(players).length;

  return `
    <div class="game-detail">
      <button class="btn btn-ghost" onclick="${isHost ? 'hideHostGameDetail()' : 'hideGameDetail()'}">→ رجوع</button>
      <div class="detail-icon">${game.icon}</div>
      <h2 style="font-family:'Cairo'; text-align:center;">${game.title}</h2>
      <p class="narrator">${game.desc}</p>
      <ol class="rules-list">${game.rules.map(r => `<li>${escapeHtml(r)}</li>`).join('')}</ol>
      <p class="muted">الحد الأدنى للاعبين: ${game.minPlayers}</p>
      <div class="players-box">
        <h3 style="font-family:'Cairo'; font-size:14px; color:var(--text-dim);">جاهزون (${readyNames.length})</h3>
        <div>${readyNames.map(n => `<span class="chip">${escapeHtml(n)}</span>`).join('') || '<span class="muted">لا أحد جاهز بعد</span>'}</div>
      </div>
      <div style="text-align:center; margin-top:10px;">
        ${isHost
          ? `<button class="btn" ${totalPlayers < game.minPlayers ? 'disabled' : ''} onclick="startGame('${game.id}','${code}')">ابدأ اللعبة</button>`
          : `<button class="btn ${iAmReady ? 'btn-ghost' : ''}" onclick="toggleReady('${code}','${myId}','${game.id}')">${iAmReady ? 'إلغاء الجهوزية' : 'أنا جاهز ✅'}</button>`}
      </div>
    </div>
  `;
}
window.toggleReady = function(code, myId, gameId){
  const ref = db.ref('rooms/'+code+'/votes/'+myId);
  ref.once('value', snap => { snap.val() === gameId ? ref.remove() : ref.set(gameId); });
};

/* =====================================================================
   SECTION 5 — HOST CONTROLLER
   ===================================================================== */
let ACTIVE_HOST_CODE = null;
let lastHostRoom = null;
let hostDetailGameId = null;

function renderHost(){
  const savedCode = localStorage.getItem('hostRoomCode');
  if (savedCode) {
    db.ref('rooms/' + savedCode).once('value', snap => {
      if (snap.exists()) initHostRoom(savedCode, false);
      else { localStorage.removeItem('hostRoomCode'); initHostRoom(makeRoomCode(), true); }
    });
  } else {
    initHostRoom(makeRoomCode(), true);
  }
}

function initHostRoom(code, isNew){
  ACTIVE_HOST_CODE = code;
  localStorage.setItem('hostRoomCode', code);
  const roomRef = db.ref('rooms/' + code);
  if (isNew) roomRef.set({ status:'voting', players:{}, votes:{}, activeGame:null });

  app.innerHTML = `
    <button class="btn btn-ghost top-bar" id="newRoomBtn">غرفة جديدة</button>
    <div class="brand">🎮 منصة <b>الألعاب</b></div>
    <div class="stage" id="stage"></div>
  `;
  document.getElementById('newRoomBtn').onclick = () => {
    if (confirm('سيتم إنشاء غرفة جديدة وفقدان الاتصال باللاعبين الحاليين. متابعة؟')) {
      localStorage.removeItem('hostRoomCode');
      location.reload();
    }
  };

  roomRef.on('value', snap => dispatchHostRender(code, snap.val()));
}

function dispatchHostRender(code, room){
  if (!room) return;
  lastHostRoom = room;
  if (room.status === 'voting') renderHostLobby(code, room);
  else if (room.status === 'in_game' && room.activeGame === 'mafia') renderMafiaHost(code, room);
  else if (room.status === 'in_game' && room.activeGame === 'silentdraw') renderSilentDrawHost(code, room);
  else renderHostGenericPlaceholder(code, room);
}

/* =====================================================================
   SECTION 6 — MAFIA MODULE
   ===================================================================== */
function assignMafiaRoles(ids){
  const n = ids.length;
  const shuffled = shuffle(ids);
  const mafiaCount = Math.max(1, Math.floor(n/4));
  const roles = {};
  let i = 0;
  for (let k=0;k<mafiaCount;k++) roles[shuffled[i++]] = 'mafia';
  if (n>=5) roles[shuffled[i++]] = 'police';
  if (n>=6) roles[shuffled[i++]] = 'doctor';
  while (i<n) roles[shuffled[i++]] = 'citizen';
  return roles;
}

window.startMafiaGame = function(code){
  const roomRef = db.ref('rooms/'+code);
  roomRef.child('players').once('value', snap => {
    const players = snap.val() || {};
    const ids = Object.keys(players);
    if (ids.length < 4) { alert('تحتاج 4 لاعبين على الأقل لبدء لعبة المافيا'); return; }
    const roles = assignMafiaRoles(ids);
    const alive = {}; ids.forEach(id => alive[id] = true);
    roomRef.update({
      status:'in_game', activeGame:'mafia',
      mafia:{ phase:'role_reveal', roles, alive, round:1,
        nightVotes:{}, policeResults:{}, dayVotes:{},
        lastNightVictim:null, lastDayEliminated:null, winner:null }
    });
  });
};

window.mafiaNext = function(code, action){
  const mRef = db.ref('rooms/'+code+'/mafia');
  mRef.once('value', snap => {
    const m = snap.val(); if (!m) return;
    if (action==='to_police') mRef.update({ phase:'night_police' });
    else if (action==='to_doctor') mRef.update({ phase:'night_doctor' });
    else if (action==='to_night') mRef.update({ phase:'night_mafia' });
    else if (action==='reveal'){
      const mVotes = (m.nightVotes && m.nightVotes.mafia) || {};
      const tally = {};
      Object.values(mVotes).forEach(t => tally[t]=(tally[t]||0)+1);
      let victim=null, max=0;
      Object.entries(tally).forEach(([id,c]) => { if (c>max){max=c; victim=id;} });
      const protectedId = m.nightVotes && m.nightVotes.doctorTarget;
      const alive = {...m.alive};
      let died = null;
      if (victim && victim !== protectedId) { alive[victim]=false; died=victim; }
      mRef.update({ alive, lastNightVictim: died, phase:'reveal' }).then(()=>checkMafiaWin(code));
    }
    else if (action==='to_discussion') mRef.update({ phase:'discussion' });
    else if (action==='to_voting') mRef.update({ phase:'voting', dayVotes:{} });
    else if (action==='reveal_vote'){
      const dv = m.dayVotes || {};
      const tally = {};
      Object.values(dv).forEach(t => { if (t!=='abstain') tally[t]=(tally[t]||0)+1; });
      let top=null, max=0, tie=false;
      Object.entries(tally).forEach(([id,c]) => {
        if (c>max){ max=c; top=id; tie=false; } else if (c===max){ tie=true; }
      });
      const alive = {...m.alive};
      let eliminated=null;
      if (top && !tie) { alive[top]=false; eliminated=top; }
      mRef.update({ alive, lastDayEliminated: eliminated, phase:'vote_reveal' }).then(()=>checkMafiaWin(code));
    }
    else if (action==='to_next_round') mRef.update({ phase:'night_mafia', round:(m.round||1)+1, nightVotes:{} });
  });
};

function checkMafiaWin(code){
  const mRef = db.ref('rooms/'+code+'/mafia');
  mRef.once('value', snap => {
    const m = snap.val(); if (!m) return;
    const aliveIds = Object.keys(m.alive).filter(id=>m.alive[id]);
    const aliveMafia = aliveIds.filter(id=>m.roles[id]==='mafia').length;
    const aliveOthers = aliveIds.length - aliveMafia;
    if (aliveMafia===0) mRef.update({ phase:'ended', winner:'citizens' });
    else if (aliveMafia>=aliveOthers) mRef.update({ phase:'ended', winner:'mafia' });
  });
}

window.startSilentDrawGame = function(code){
  const roomRef = db.ref('rooms/'+code);
  roomRef.child('players').once('value', snap => {
    const players = snap.val() || {};
    const ids = Object.keys(players);
    if (ids.length < 4) { alert('تحتاج 4 لاعبين على الأقل (فريقين) لبدء الرسم الصامت'); return; }

    // توزيع اللاعبين بناءً على اختيارهم، مع موازنة متبقي اللاعبين تلقائياً
    let teamA = ids.filter(id => players[id].team === 'A');
    let teamB = ids.filter(id => players[id].team === 'B');
    let unassigned = shuffle(ids.filter(id => players[id].team !== 'A' && players[id].team !== 'B'));

    unassigned.forEach(id => {
      if (teamA.length <= teamB.length) teamA.push(id);
      else teamB.push(id);
    });

    teamA = shuffle(teamA);
    teamB = shuffle(teamB);

    db.ref('strokes/'+code+'_A').set(null);
    db.ref('strokes/'+code+'_B').set(null);
    roomRef.update({
      status:'in_game', activeGame:'silentdraw',
      silentdraw:{
        phase:'round_start', round:1,
        teams:{ A:teamA, B:teamB },
        guideOf:{ A:teamA[0], B:teamB[0] },
        drawerOf:{ A:teamA[1], B:teamB[1] },
        words:{ A: pickRandomWordPair().w, B: pickRandomWordPair().w },
        undosLeft:{ A:3, B:3 },
        correctCount:{ A:0, B:0 },
        results:{ A:null, B:null },
        timerEnd:null, winner:null
      }
    });
  });
};

window.silentDrawBeginDrawing = function(code){
  db.ref('rooms/'+code+'/silentdraw').update({ phase:'drawing', timerEnd: Date.now()+90000, results:{A:null,B:null} });
};

window.silentDrawFinishRound = function(code){
  const sdRef = db.ref('rooms/'+code+'/silentdraw');
  sdRef.once('value', snap => {
    const sd = snap.val(); if (!sd) return;
    const results = { A: sd.results.A || 'wrong', B: sd.results.B || 'wrong' };
    const correctCount = {...sd.correctCount};
    ['A','B'].forEach(t => { if (results[t]==='correct') correctCount[t] = (correctCount[t]||0)+1; });
    const winner = correctCount.A>=3 ? 'A' : (correctCount.B>=3 ? 'B' : null);
    sdRef.update({ results, correctCount, phase: winner ? 'ended' : 'round_result', winner });
  });
};

window.silentDrawMarkCorrect = function(code, team){
  const sdRef = db.ref('rooms/'+code+'/silentdraw');
  sdRef.child('results/'+team).set('correct').then(() => {
    sdRef.once('value', snap => {
      const sd = snap.val(); if (!sd) return;
      const other = team === 'A' ? 'B' : 'A';
      if (sd.results[other] === 'correct') window.silentDrawFinishRound(code);
    });
  });
};

window.submitSilentGuess = function(code, team, actualWord){
  const input = document.getElementById('guessInput');
  if (!input) return;
  const guess = input.value.trim();
  if (!guess) return;
  const fb = document.getElementById('guessFeedback');
  if (normalizeAr(guess) === normalizeAr(actualWord)){
    if (fb) fb.innerHTML = '<span style="color:var(--green); font-weight:700;">🎉 صحيح! أحسنت</span>';
    window.silentDrawMarkCorrect(code, team);
  } else {
    if (fb) fb.innerHTML = '<span style="color:var(--accent-2);">❌ ليست الكلمة، حاول مرة أخرى</span>';
  }
  input.value = '';
};

window.silentDrawNextRound = function(code){
  const sdRef = db.ref('rooms/'+code+'/silentdraw');
  sdRef.once('value', snap => {
    const sd = snap.val(); if (!sd) return;
    db.ref('strokes/'+code+'_A').set(null);
    db.ref('strokes/'+code+'_B').set(null);
    sdRef.update({
      phase:'round_start', round:(sd.round||1)+1,
      guideOf:{ A: sd.drawerOf.A, B: sd.drawerOf.B },
      drawerOf:{ A: sd.guideOf.A, B: sd.guideOf.B },
      words:{ A: pickRandomWordPair().w, B: pickRandomWordPair().w },
      undosLeft:{ A:3, B:3 }, results:{ A:null, B:null }, timerEnd:null
    });
  });
};

window.silentDrawUndo = function(code, team){
  const sdRef = db.ref('rooms/'+code+'/silentdraw');
  sdRef.once('value', snap => {
    const sd = snap.val(); if (!sd || sd.phase!=='drawing') return;
    if ((sd.undosLeft[team]||0) <= 0) return;
    const strokesRef = db.ref('strokes/'+code+'_'+team);
    strokesRef.limitToLast(1).once('value', s2 => {
      s2.forEach(child => strokesRef.child(child.key).remove());
      sdRef.child('undosLeft/'+team).set(sd.undosLeft[team]-1);
    });
  });
};

function setupSilentCanvas(code, team){
  const canvas = document.getElementById('drawCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const strokesRef = db.ref('strokes/'+code+'_'+team);

  strokesRef.once('value', snap => {
    Object.values(snap.val()||{}).forEach(s => drawSegment(ctx, canvas, s));
  });

  let drawing = false, pts = [];
  function getPos(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { x: cx/r.width, y: cy/r.height };
  }
  function start(e){ e.preventDefault(); drawing=true; pts=[getPos(e)]; }
  function move(e){
    if (!drawing) return; e.preventDefault();
    const p = getPos(e); const prev = pts[pts.length-1] || p;
    pts.push(p);
    drawSegment(ctx, canvas, { points:[prev,p], color:currentColor, size:4 });
  }
  function end(){
    if (!drawing) return; drawing=false;
    if (pts.length>1) strokesRef.push({ points: pts.slice(), color: currentColor, size:4 });
    pts=[];
  }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}

function silentDrawRankingHtml(sd, players){
  const teamLabel = t => sd.teams[t].map(id => players[id]?.name || '').join(' و ');
  const ranked = ['A','B'].sort((a,b) => sd.correctCount[b] - sd.correctCount[a]);
  return ranked.map((t,i) => `<div class="chip team-${t}">${i+1}. فريق ${t} (${escapeHtml(teamLabel(t))}) — ${sd.correctCount[t]} نقطة</div>`).join('');
}

function renderSilentDrawHost(code, room){
  const sd = room.silentdraw; if (!sd) return;
  const players = room.players || {};
  const teamLabel = t => sd.teams[t].map(id=>players[id]?.name||'').join(' و ');
  let narrator = '', control = '', boards = '';
  const showBoards = ['drawing','round_result','ended'].includes(sd.phase);

  if (sd.phase==='round_start'){
    narrator = `الجولة ${sd.round} — الموجّهون يشاهدون صور أشكالهم الآن سرًا.`;
    control = `<button class="btn" onclick="silentDrawBeginDrawing('${code}')">ابدأ الرسم 🎨</button>`;
  } else if (sd.phase==='drawing'){
    narrator = `⏱️ <span id="timerText">--</span> ثانية — ممنوع الكلام! فقط إشارات.`;
    control = `<button class="btn" onclick="silentDrawFinishRound('${code}')">إنهاء الجولة والتقييم</button>`;
  } else if (sd.phase==='round_result'){
    narrator = `نتيجة الجولة: فريق A ${sd.results.A==='correct'?'✅':'❌'} — فريق B ${sd.results.B==='correct'?'✅':'❌'}`;
    control = `<button class="btn" onclick="silentDrawNextRound('${code}')">الجولة التالية 🔁</button>`;
  } else if (sd.phase==='ended'){
    narrator = `🏆 فاز الفريق ${sd.winner}!`;
    control = `<button class="btn" onclick="resetToLobby('${code}')">لعبة جديدة 🔁</button>`;
  }

  if (showBoards){
    boards = `<div class="draw-layout">${['A','B'].map(t => `
      <div class="team-board">
        <h4 style="font-family:'Cairo';">فريق ${t} —${escapeHtml(teamLabel(t))}</h4>
        <div class="canvas-wrap"><canvas id="canvas${t}" width="340" height="300"></canvas></div>
        <p class="muted">الكلمة: <b>${escapeHtml(sd.words[t])}</b> — تراجعات متبقية: ${sd.undosLeft[t]}</p>
        <p class="muted">${sd.results[t]==='correct' ? '✅ خمّنوا الكلمة بنجاح' : (sd.phase==='drawing' ? '⏳ ينتظرون التخمين' : '❌ لم يخمّنوا')}</p>
      </div>`).join('')}</div>`;
  }

  document.getElementById('stage').innerHTML = `
    <div style="margin-bottom:15px;">
      <button class="btn btn-danger" onclick="resetToLobby('${code}')">🛑 إنهاء اللعبة والعودة للوحة التحكم</button>
    </div>
    <h2 style="font-family:'Cairo'; color:var(--accent);">الرسم الصامت 🤫</h2>
    <p class="narrator">${narrator}</p>
    <div class="players-box"><h3 style="font-family:'Cairo'; font-size:14px; color:var(--text-dim);">الترتيب (الفوز عند 3 نقاط)</h3>${silentDrawRankingHtml(sd, players)}</div>
    ${boards}
    ${control}
  `;

  if (showBoards){
    mirrorCanvasFrom(code+'_A', 'canvasA');
    mirrorCanvasFrom(code+'_B', 'canvasB');
  }
  if (sd.phase==='drawing') startHostTimerWatch(sd.timerEnd);
}

function renderSilentDrawPlayer(code, myId, name, room){
  const sd = room.silentdraw; if (!sd) return;
  const players = room.players || {};
  const myTeam = sd.teams.A.includes(myId) ? 'A' : (sd.teams.B.includes(myId) ? 'B' : null);

  if (!myTeam){
    app.innerHTML = `<div class="phone"><div class="card"><h2 style="font-family:'Cairo';">👀 أنت متفرج</h2><p class="muted">انضممت بعد بدء اللعبة، شاهد شاشة الحكم.</p></div></div>`;
    return;
  }

  const isGuide = sd.guideOf[myTeam] === myId;
  const teammateId = sd.teams[myTeam].find(id => id !== myId);
  const teammateName = players[teammateId]?.name || '';

  if (sd.phase==='round_start'){
    app.innerHTML = isGuide
      ? `<div class="phone"><div class="card">
          <h2 style="font-family:'Cairo';">أنت الموجّه 🤫</h2>
          ${renderIllustration(sd.words[myTeam])}
          <p style="font-family:'Cairo'; font-size:26px; color:var(--accent);">${escapeHtml(sd.words[myTeam])}</p>
          <p class="muted">وضّح لـ ${escapeHtml(teammateName)} بالإشارة فقط، بدون أي كلام!</p>
        </div></div>`
      : `<div class="phone"><div class="card">
          <h2 style="font-family:'Cairo';">أنت الرسام 🎨</h2>
          <p class="muted">${escapeHtml(teammateName)} يعرف الشكل وسيوجهك بالإشارة فقط. راقبه جيدًا وحاول تكتشف ماذا ترسم!</p>
        </div></div>`;
    return;
  }

  if (sd.phase==='drawing'){
    if (isGuide){
      app.innerHTML = `<div class="phone"><div class="card">
        <h2 style="font-family:'Cairo';">تذكير بالمطلوب</h2>
        ${renderIllustration(sd.words[myTeam])}
        <p style="font-family:'Cairo'; font-size:26px; color:var(--accent);">${escapeHtml(sd.words[myTeam])}</p>
        <p class="muted">بدون كلام! فقط إشارات لصديقك.</p>
        <p class="muted">${sd.results[myTeam]==='correct' ? '🎉 صديقك خمّن الكلمة!' : ''}</p>
      </div></div>`;
    } else if (sd.results[myTeam] === 'correct') {
      app.innerHTML = `<div class="phone"><div class="card">
        <h2 style="font-family:'Cairo'; color:var(--green);">🎉 أحسنت! خمّنت صح</h2>
        <p class="muted">بانتظار الفريق الآخر أو انتهاء الجولة…</p>
      </div></div>`;
    } else {
      app.innerHTML = `<div class="phone" style="padding:10px;">
        <div class="card" style="max-width:100%;">
          <canvas id="drawCanvas" width="320" height="320" style="width:100%; touch-action:none; background:#fff; border-radius:12px;"></canvas>
          <div class="color-row" style="display:flex; gap:8px; justify-content:center; margin-top:10px;">
            ${['#000000','#e74c3c','#3b82f6','#00b894','#f4c542'].map(c=>`<button onclick="setDrawColor('${c}')" style="width:28px; height:28px; border-radius:50\%; background:${c}; border:2px solid #fff;"></button>`).join('')}
          </div>
          <button class="btn btn-ghost" ${sd.undosLeft[myTeam]<=0?'disabled':''} onclick="silentDrawUndo('${code}','${myTeam}')" style="margin-top:10px;">تراجع (${sd.undosLeft[myTeam]} متبقية)</button>
          <input type="text" id="guessInput" placeholder="ماذا ترسم؟ اكتب تخمينك" style="margin-top:14px;" />
          <button class="btn" style="width:100%; margin-top:8px;" onclick="submitSilentGuess('${code}','${myTeam}','${escapeHtml(sd.words[myTeam])}')">تحقق ✅</button>
          <div id="guessFeedback" class="muted" style="margin-top:8px;"></div>
        </div>
      </div>`;
      setupSilentCanvas(code, myTeam);
    }
    return;
  }

  if (sd.phase==='round_result'){
    app.innerHTML = `<div class="phone"><div class="card">
      <h2 style="font-family:'Cairo';">نتيجة الجولة</h2>
      <p class="muted">فريق A: ${sd.results.A==='correct'?'✅ صحيح':'❌ لم يخمّنوا'} — الكلمة: ${escapeHtml(sd.words.A)}</p>
      <p class="muted">فريق B: ${sd.results.B==='correct'?'✅ صحيح':'❌ لم يخمّنوا'} — الكلمة: ${escapeHtml(sd.words.B)}</p>
      <div class="players-box">${silentDrawRankingHtml(sd, players)}</div>
      <p class="muted">الجولة التالية تبدأ قريبًا…</p>
    </div></div>`;
    return;
  }

  if (sd.phase==='ended'){
    app.innerHTML = `<div class="phone"><div class="card">
      <h2 style="font-family:'Cairo';">🏆 فاز الفريق ${sd.winner}!</h2>
      <div class="players-box">${silentDrawRankingHtml(sd, players)}</div>
    </div></div>`;
  }
}

/* =====================================================================
   SECTION 8 — PLAYER CONTROLLER
   ===================================================================== */
let CURRENT_PLAYER_NAME = '';
let ACTIVE_ROOM_CODE = null;
let ACTIVE_PLAYER_ID = null;
let lastPlayerRoom = null;
let playerDetailGameId = null;

function renderPlayer(code){
  const roomRef = db.ref('rooms/' + code);
  let myId = localStorage.getItem('player_id_' + code);

  function attach(id, name){
    CURRENT_PLAYER_NAME = name;
    ACTIVE_ROOM_CODE = code;
    ACTIVE_PLAYER_ID = id;
    roomRef.on('value', snap => {
      const room = snap.val();
      if (!room) { app.innerHTML = `<div class="phone"><div class="card"><h2 style="font-family:'Cairo';">انتهت الغرفة</h2><p class="muted">اطلب رابطًا جديدًا من المضيف.</p></div></div>`; return; }
      dispatchPlayerRender(code, id, name, room);
    });
  }

  if (!myId) {
    app.innerHTML = `<div class="phone"><div class="card">
      <h2 style="font-family:'Cairo';">انضم للغرفة</h2>
      <input type="text" id="nameInput" placeholder="اكتب اسمك" maxlength="15" autofocus />
      <button class="btn" id="joinBtn" style="width:100%; margin-top:15px;">دخول</button>
    </div></div>`;
    document.getElementById('joinBtn').onclick = () => {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) return;
      const newId = roomRef.child('players').push().key;
      roomRef.child('players/' + newId).set({ name });
      localStorage.setItem('player_id_' + code, newId);
      attach(newId, name);
    };
  } else {
    roomRef.child('players/' + myId).once('value', snap => {
      if (snap.exists()) attach(myId, snap.val().name);
      else { localStorage.removeItem('player_id_' + code); renderPlayer(code); }
    });
  }
}

function dispatchPlayerRender(code, myId, name, room){
  lastPlayerRoom = room;
  if (room.status === 'voting') renderPlayerVoting(code, myId, name, room);
  else if (room.status === 'in_game' && room.activeGame === 'mafia') renderMafiaPlayer(code, myId, name, room);
  else if (room.status === 'in_game' && room.activeGame === 'silentdraw') renderSilentDrawPlayer(code, myId, name, room);
  else app.innerHTML = `<div class="phone"><div class="card"><h2 style="font-family:'Cairo';">🎮 اللعبة قيد التطوير</h2><p class="muted">انظر شاشة المضيف.</p></div></div>`;
}

window.showGameDetail = function(gameId){ playerDetailGameId = gameId; if (lastPlayerRoom) renderPlayerVoting(ACTIVE_ROOM_CODE, ACTIVE_PLAYER_ID, CURRENT_PLAYER_NAME, lastPlayerRoom); };
window.hideGameDetail = function(){ playerDetailGameId = null; if (lastPlayerRoom) renderPlayerVoting(ACTIVE_ROOM_CODE, ACTIVE_PLAYER_ID, CURRENT_PLAYER_NAME, lastPlayerRoom); };

function renderPlayerVoting(code, myId, name, room){
  if (playerDetailGameId){
    const game = GAMES_LIST.find(g => g.id === playerDetailGameId);
    app.innerHTML = gameDetailHtml(game, room, code, myId, false);
    return;
  }

  const votes = room.votes || {};
  const myPlayer = room.players && room.players[myId];
  const myTeam = myPlayer ? myPlayer.team : null;

  const cardsHtml = GAMES_LIST.map(g => {
    if (!g.available) return `<div class="game-card disabled"><div class="game-icon-badge">${g.icon}</div><div class="game-title">${g.title}</div><div class="coming-soon">قريبًا</div></div>`;
    const isReady = votes[myId] === g.id;
    return `<div class="game-card ${isReady?'selected':''}" onclick="showGameDetail('${g.id}')">
      <div class="game-icon-badge">${g.icon}</div><div class="game-title">${g.title}</div>
      ${isReady ? '<div class="vote-badge" style="background:var(--green);">أنت جاهز ✓</div>' : '<div class="vote-badge">التفاصيل</div>'}
    </div>`;
  }).join('');

  app.innerHTML = `<div class="phone"><div class="card" style="max-width:520px;">
    <h2 style="font-family:'Cairo';">أهلاً ${escapeHtml(name)} 👋</h2>

    <!-- خيار اختيار الفريق للألعاب الجماعية -->
    <div class="team-selector-box">
      <p style="margin:0 0 10px 0; font-weight:700; font-size:14px; color:var(--text);">انضم لأحد الفريقين (اختياري):</p>
      <button class="btn-team ${myTeam==='A'?'selected-a':''}" onclick="setPlayerTeam('${code}','${myId}','A')">🔵 فريق A</button>
      <button class="btn-team ${myTeam==='B'?'selected-b':''}" onclick="setPlayerTeam('${code}','${myId}','B')">🔴 فريق B</button>
      ${myTeam ? `<div style="font-size:12px; margin-top:6px; color:var(--text-dim);">أنت حالياً في <b>فريق ${myTeam}</b></div>` : '<div style="font-size:12px; margin-top:6px; color:var(--text-dim);">لم تختار فريقًا (سيتم توزيعك تلقائيًا)</div>'}
    </div>

    <p class="muted">اختر لعبة لعرض شرحها والاستعداد لها:</p>
    <div class="games-grid">${cardsHtml}</div>
    <p class="muted">بانتظار المضيف لبدء اللعبة…</p>
  </div></div>`;
}

/* ================= ENTRY POINT ================= */
const params = new URLSearchParams(location.search);
const roomParam = params.get('room');
if (!roomParam) { renderHost(); } else { renderPlayer(roomParam.trim()); }
</script>
