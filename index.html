<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>منصة الألعاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<style>
  :root{
    --bg:#0f0c29;
    --surface:#1e1c2a;
    --surface-2:#26243590;
    --accent:#667eea;
    --accent-2:#ff4d6d;
    --text:#f5f1e8;
    --text-dim:#a8a3b8;
    --green:#00b894;
    --mafia:#e74c3c;
    --police:#3b82f6;
    --doctor:#5fd0c5;
    --citizen:#f4c542;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; touch-action:manipulation;}
  body{
    margin:0; background:
      radial-gradient(circle at 50% -10%, rgba(102,126,234,.18), transparent 55%),
      var(--bg);
    color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}

  .brand{ text-align:center; padding:16px 0 4px; font-size:14px; color:var(--text-dim); }
  .brand b{color:var(--accent); font-family:'Cairo',sans-serif;}
  .btn{
    font-family:'Cairo',sans-serif; font-weight:800; font-size:16px;
    border:none; border-radius:14px; padding:12px 24px; cursor:pointer;
    color:#fff; background:var(--accent); box-shadow:0 6px 0 #4a5db5;
    transition:transform .08s ease; margin:6px;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #4a5db5;}
  .btn:disabled{ background:#4a4658; color:#87829a; box-shadow:0 6px 0 #322f3d; cursor:default; }
  .btn-ghost{ background:transparent; box-shadow:none; border:2px solid #3a3650; font-size:13px; padding:8px 16px; }

  input[type=text]{
    font-family:'Tajawal',sans-serif; font-size:18px; padding:14px 16px;
    border-radius:12px; border:2px solid #3a3650; background:#100f17;
    color:var(--text); width:100%; outline:none; text-align:center;
  }

  .games-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; width:100%; max-width:600px; margin-top:18px; }
  .game-card{ background:var(--surface); border:2px solid #3a3650; border-radius:16px; padding:18px 10px; text-align:center; cursor:pointer; transition:all .15s ease; }
  .game-card.disabled{ opacity:.5; cursor:not-allowed; }
  .game-card:hover:not(.disabled){ border-color:var(--accent); transform:translateY(-3px); }
  .game-card.selected{ border-color:var(--green); background:rgba(0,184,148,.1); }
  .game-icon{ font-size:38px; margin-bottom:8px; }
  .game-title{ font-family:'Cairo',sans-serif; font-size:15px; font-weight:700; margin-bottom:4px; }
  .vote-badge{ background:var(--accent); color:#fff; font-size:12px; font-weight:bold; padding:3px 10px; border-radius:20px; display:inline-block; margin-top:8px; }
  .coming-soon{ color:var(--accent-2); font-size:12px; font-weight:bold; margin-top:8px; }

  .stage{ flex:1; display:flex; flex-direction:column; align-items:center; padding:20px 16px 40px; text-align:center; width:100%; }
  .room-code{ font-family:'Cairo',sans-serif; font-weight:900; font-size:44px; letter-spacing:10px; color:var(--accent); text-shadow:0 0 30px rgba(102,126,234,.5); margin:4px 0; }
  .join-row{ margin-top:16px; display:flex; gap:18px; align-items:center; justify-content:center; flex-wrap:wrap; background:var(--surface); padding:14px 18px; border-radius:16px; }
  #qr{ background:#fff; padding:8px; border-radius:10px; line-height:0; }
  .link-text{ direction:ltr; font-size:12px; color:var(--text-dim); word-break:break-all; max-width:220px; text-align:left; }
  .players-box{ margin-top:26px; width:100%; max-width:640px; }
  .chip{ background:var(--surface); border:1px solid #3a3650; padding:8px 16px; border-radius:999px; font-weight:700; display:inline-block; margin:5px; font-size:14px; }
  .chip.dead{ opacity:.45; text-decoration:line-through; }
  .narrator{ font-size:17px; line-height:1.7; max-width:520px; margin:10px auto; }
  .top-bar{ position:absolute; top:10px; left:10px; }

  .phone{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  .card{ background:var(--surface); border-radius:20px; padding:28px 22px; width:100%; max-width:420px; text-align:center; }
  .muted{ color:var(--text-dim); font-size:14px; margin-top:10px; }

  .role-card{ border-radius:20px; padding:28px 20px; margin-bottom:14px; }
  .role-icon{ font-size:56px; }
  .role-name{ font-family:'Cairo',sans-serif; font-weight:900; font-size:26px; margin:8px 0; }
  .role-desc{ font-size:14px; opacity:.9; }
  .role-mafia{ background:linear-gradient(160deg,var(--mafia),#7f1d1d); }
  .role-police{ background:linear-gradient(160deg,var(--police),#1e3a8a); }
  .role-doctor{ background:linear-gradient(160deg,var(--doctor),#0f766e); color:#0b1120; }
  .role-citizen{ background:linear-gradient(160deg,var(--citizen),#92600a); color:#241a02; }

  .target-list{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .target-btn{ font-family:'Tajawal',sans-serif; font-size:16px; font-weight:700; padding:13px; border-radius:12px; border:2px solid #3a3650; background:#100f17; color:var(--text); cursor:pointer; }
  .target-btn.picked{ border-color:var(--green); background:rgba(0,184,148,.12); }
  .target-btn:disabled{ opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   1) إعدادات Firebase
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBwU4coCgrk1kkzQUfj2vFh5kzoUlFzDnY",
  authDomain: "game-platform-v1.firebaseapp.com",
  databaseURL: "https://game-platform-v1-default-rtdb.firebaseio.com",
  projectId: "game-platform-v1",
  storageBucket: "game-platform-v1.firebasestorage.app",
  messagingSenderId: "1060382508222",
  appId: "1:1060382508222:web:b009f33dba05559806caef",
  measurementId: "G-0BR4SRYKH4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const app = document.getElementById('app');

const GAMES_LIST = [
  { id: 'mafia',   title: 'من هم المافيا؟', icon: '🕵️', available: true },
  { id: 'clicker', title: 'أسرع ضغطة',      icon: '⚡', available: false },
  { id: 'draw',    title: 'ارسم وخمن',      icon: '🎨', available: false },
  { id: 'trivia',  title: 'أسئلة وتحديات',  icon: '🧠', available: false }
];
const ROLE_META = {
  mafia:   { name:'مافيا',  icon:'🔪', cls:'role-mafia',   desc:'تعرف على زملائك بالمافيا. كل ليلة تختارون معًا ضحية.' },
  police:  { name:'شرطي',   icon:'👮', cls:'role-police',  desc:'كل ليلة تحقق من شخص لتعرف إن كان مافيا.' },
  doctor:  { name:'طبيب',   icon:'⚕️', cls:'role-doctor',  desc:'كل ليلة تحمي شخصًا واحدًا من القتل.' },
  citizen: { name:'مواطن',  icon:'🙂', cls:'role-citizen', desc:'ناقش، استنتج، وصوّت بذكاء لكشف المافيا.' }
};

function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function makeRoomCode(){ return String(Math.floor(1000 + Math.random()*9000)); }
function joinUrl(code){ return location.origin + location.pathname + '?room=' + code; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const params = new URLSearchParams(location.search);
const roomParam = params.get('room');
if (!roomParam) { renderHost(); } else { renderPlayer(roomParam.trim()); }

/* ================= HOST ================= */
function renderHost(){
  const savedCode = localStorage.getItem('hostRoomCode');
  if (savedCode) {
    db.ref('rooms/' + savedCode).once('value', snap => {
      if (snap.exists()) initHostRoom(savedCode, false);
      else { localStorage.removeItem('hostRoomCode'); initHostRoom(makeRoomCode(), true); }
    });
  } else {
    initHostRoom(makeRoomCode(), true);
  }
}

function initHostRoom(code, isNew){
  localStorage.setItem('hostRoomCode', code);
  const roomRef = db.ref('rooms/' + code);
  if (isNew) roomRef.set({ status:'voting', players:{}, votes:{}, activeGame:null });

  app.innerHTML = `
    <button class="btn btn-ghost top-bar" id="newRoomBtn">غرفة جديدة</button>
    <div class="brand">منصة <b>الألعاب</b></div>
    <div class="stage" id="stage"></div>
  `;
  document.getElementById('newRoomBtn').onclick = () => {
    if (confirm('سيتم إنشاء غرفة جديدة وفقدان الاتصال باللاعبين الحاليين. متابعة؟')) {
      localStorage.removeItem('hostRoomCode');
      location.reload();
    }
  };

  roomRef.on('value', snap => {
    const room = snap.val();
    if (!room) return;
    if (room.status === 'voting') renderHostLobby(code, room);
    else if (room.status === 'in_game' && room.activeGame === 'mafia') renderMafiaHost(code, room);
    else renderHostGenericPlaceholder(code, room);
  });
}

function renderHostLobby(code, room){
  const players = room.players || {};
  const votes = room.votes || {};
  const tally = {};
  Object.values(votes).forEach(g => tally[g] = (tally[g]||0)+1);

  const cardsHtml = GAMES_LIST.map(g => {
    const v = tally[g.id] || 0;
    if (g.available) {
      return `
        <div class="game-card">
          <div class="game-icon">${g.icon}</div>
          <div class="game-title">${g.title}</div>
          <div class="vote-badge">${v} صوت</div>
          <button class="btn" style="padding:6px 12px; font-size:13px; width:100%;" onclick="startGame('${g.id}','${code}')">ابدأ اللعبة</button>
        </div>`;
    }
    return `
      <div class="game-card disabled">
        <div class="game-icon">${g.icon}</div>
        <div class="game-title">${g.title}</div>
        <div class="coming-soon">قريبًا</div>
      </div>`;
  }).join('');

  document.getElementById('stage').innerHTML = `
    <p style="margin:0; color:var(--text-dim);">رمز الغرفة</p>
    <p class="room-code">${code}</p>
    <div class="join-row">
      <div id="qr"></div>
      <div>
        <div class="link-text">${joinUrl(code)}</div>
        <button class="btn btn-ghost" id="copyBtn">نسخ الرابط</button>
      </div>
    </div>
    <div class="players-box">
      <h3 style="font-family:'Cairo';">اللاعبون (${Object.keys(players).length})</h3>
      <div>${Object.values(players).map(p=>`<span class="chip">${escapeHtml(p.name)}</span>`).join('') || '<span class="muted">بانتظار انضمام اللاعبين…</span>'}</div>
    </div>
    <div class="players-box">
      <h3 style="font-family:'Cairo';">الألعاب المتاحة للتصويت</h3>
      <div class="games-grid">${cardsHtml}</div>
    </div>
  `;
  new QRCode(document.getElementById('qr'), { text: joinUrl(code), width:120, height:120 });
  document.getElementById('copyBtn').onclick = () => {
    navigator.clipboard.writeText(joinUrl(code)).then(()=>{
      document.getElementById('copyBtn').textContent = 'تم النسخ ✓';
    });
  };
}

function renderHostGenericPlaceholder(code, room){
  const g = GAMES_LIST.find(x=>x.id===room.activeGame);
  document.getElementById('stage').innerHTML = `
    <h2 style="font-family:'Cairo'; color:var(--accent);">🎮 ${g ? g.title : ''}</h2>
    <p class="muted">هذه اللعبة قيد التطوير حاليًا.</p>
    <button class="btn" onclick="resetToLobby('${code}')">رجوع لقائمة الألعاب</button>
  `;
}

window.startGame = function(gameId, code){
  if (gameId === 'mafia') { startMafiaGame(code); return; }
  db.ref('rooms/'+code).update({ status:'in_game', activeGame: gameId });
};
window.resetToLobby = function(code){
  db.ref('rooms/'+code).update({ status:'voting', activeGame:null, votes:{}, mafia:null });
};

/* ================= MAFIA — game logic ================= */
function assignMafiaRoles(ids){
  const n = ids.length;
  const shuffled = shuffle(ids);
  const mafiaCount = Math.max(1, Math.floor(n/4));
  const roles = {};
  let i = 0;
  for (let k=0;k<mafiaCount;k++) roles[shuffled[i++]] = 'mafia';
  if (n>=5) roles[shuffled[i++]] = 'police';
  if (n>=6) roles[shuffled[i++]] = 'doctor';
  while (i<n) roles[shuffled[i++]] = 'citizen';
  return roles;
}

window.startMafiaGame = function(code){
  const roomRef = db.ref('rooms/'+code);
  roomRef.child('players').once('value', snap => {
    const players = snap.val() || {};
    const ids = Object.keys(players);
    if (ids.length < 4) { alert('تحتاج 4 لاعبين على الأقل لبدء لعبة المافيا'); return; }
    const roles = assignMafiaRoles(ids);
    const alive = {}; ids.forEach(id => alive[id] = true);
    roomRef.update({
      status:'in_game', activeGame:'mafia',
      mafia:{ phase:'role_reveal', roles, alive, round:1,
        nightVotes:{}, policeResults:{}, dayVotes:{},
        lastNightVictim:null, lastDayEliminated:null, winner:null }
    });
  });
};

window.mafiaNext = function(code, action){
  const mRef = db.ref('rooms/'+code+'/mafia');
  mRef.once('value', snap => {
    const m = snap.val(); if (!m) return;
    if (action==='to_police') mRef.update({ phase:'night_police' });
    else if (action==='to_doctor') mRef.update({ phase:'night_doctor' });
    else if (action==='to_night') mRef.update({ phase:'night_mafia' });
    else if (action==='reveal'){
      const mVotes = (m.nightVotes && m.nightVotes.mafia) || {};
      const tally = {};
      Object.values(mVotes).forEach(t => tally[t]=(tally[t]||0)+1);
      let victim=null, max=0;
      Object.entries(tally).forEach(([id,c]) => { if (c>max){max=c; victim=id;} });
      const protectedId = m.nightVotes && m.nightVotes.doctorTarget;
      const alive = {...m.alive};
      let died = null;
      if (victim && victim !== protectedId) { alive[victim]=false; died=victim; }
      mRef.update({ alive, lastNightVictim: died, phase:'reveal' }).then(()=>checkMafiaWin(code));
    }
    else if (action==='to_discussion') mRef.update({ phase:'discussion' });
    else if (action==='to_voting') mRef.update({ phase:'voting', dayVotes:{} });
    else if (action==='reveal_vote'){
      const dv = m.dayVotes || {};
      const tally = {};
      Object.values(dv).forEach(t => { if (t!=='abstain') tally[t]=(tally[t]||0)+1; });
      let top=null, max=0, tie=false;
      Object.entries(tally).forEach(([id,c]) => {
        if (c>max){ max=c; top=id; tie=false; } else if (c===max){ tie=true; }
      });
      const alive = {...m.alive};
      let eliminated=null;
      if (top && !tie) { alive[top]=false; eliminated=top; }
      mRef.update({ alive, lastDayEliminated: eliminated, phase:'vote_reveal' }).then(()=>checkMafiaWin(code));
    }
    else if (action==='to_next_round') mRef.update({ phase:'night_mafia', round:(m.round||1)+1, nightVotes:{} });
  });
};

function checkMafiaWin(code){
  const mRef = db.ref('rooms/'+code+'/mafia');
  mRef.once('value', snap => {
    const m = snap.val(); if (!m) return;
    const aliveIds = Object.keys(m.alive).filter(id=>m.alive[id]);
    const aliveMafia = aliveIds.filter(id=>m.roles[id]==='mafia').length;
    const aliveOthers = aliveIds.length - aliveMafia;
    if (aliveMafia===0) mRef.update({ phase:'ended', winner:'citizens' });
    else if (aliveMafia>=aliveOthers) mRef.update({ phase:'ended', winner:'mafia' });
  });
}

window.mafiaVote = function(code, myId, targetId){ db.ref('rooms/'+code+'/mafia/nightVotes/mafia/'+myId).set(targetId); };
window.doctorProtect = function(code, targetId){ db.ref('rooms/'+code+'/mafia/nightVotes/doctorTarget').set(targetId); };
window.dayVote = function(code, myId, targetId){ db.ref('rooms/'+code+'/mafia/dayVotes/'+myId).set(targetId); };
window.policeInvestigate = function(code, myId, targetId){
  const mRef = db.ref('rooms/'+code+'/mafia');
  mRef.once('value', snap => {
    const m = snap.val();
    const isMafia = m.roles[targetId] === 'mafia';
    mRef.child('policeResults/'+myId).set({ targetId, isMafia, round: m.round });
  });
};

/* ---- Mafia: host view ---- */
function renderMafiaHost(code, room){
  const m = room.mafia; if (!m) return;
  const players = room.players || {};
  const aliveIds = Object.keys(m.alive||{}).filter(id=>m.alive[id]);
  let narrator = '', control = '';

  if (m.phase==='role_reveal'){
    narrator = 'كل لاعب يشاهد بطاقة دوره الآن على جواله. تأكد الجميع رأوا أدوارهم.';
    control = `<button class="btn" onclick="mafiaNext('${code}','to_night')">ابدأ الجولة الأولى 🌙</button>`;
  } else if (m.phase==='night_mafia'){
    const v = Object.keys((m.nightVotes&&m.nightVotes.mafia)||{}).length;
    narrator = `الجولة ${m.round} — اطلب من الجميع إغلاق أعينهم. المافيا يختارون ضحيتهم (${v} صوّتوا).`;
    control = `<button class="btn" onclick="mafiaNext('${code}','to_police')">التالي: دور الشرطي 👮</button>`;
  } else if (m.phase==='night_police'){
    narrator = 'الشرطي يختار الآن شخصًا للتحقيق معه.';
    control = `<button class="btn" onclick="mafiaNext('${code}','to_doctor')">التالي: دور الطبيب ⚕️</button>`;
  } else if (m.phase==='night_doctor'){
    narrator = 'الطبيب يختار الآن شخصًا ليحميه.';
    control = `<button class="btn" onclick="mafiaNext('${code}','reveal')">كشف نتيجة الليل 🔦</button>`;
  } else if (m.phase==='reveal'){
    narrator = m.lastNightVictim ? `💀 قُتل الليلة: ${escapeHtml(players[m.lastNightVictim]?.name||'')}` : '✅ نجا الجميع الليلة!';
    control = `<button class="btn" onclick="mafiaNext('${code}','to_discussion')">ابدأ النقاش 🗣️</button>`;
  } else if (m.phase==='discussion'){
    narrator = 'افتحوا أعينكم! كل شخص يتكلم مرة واحدة الآن، ثم انتقل للتصويت.';
    control = `<button class="btn" onclick="mafiaNext('${code}','to_voting')">ابدأ التصويت 🗳️</button>`;
  } else if (m.phase==='voting'){
    const v = Object.keys(m.dayVotes||{}).length;
    narrator = `التصويت جارٍ (${v}/${aliveIds.length} صوّتوا).`;
    control = `<button class="btn" onclick="mafiaNext('${code}','reveal_vote')">إعلان نتيجة التصويت</button>`;
  } else if (m.phase==='vote_reveal'){
    narrator = m.lastDayEliminated
      ? `🚪 تم إخراج: ${escapeHtml(players[m.lastDayEliminated]?.name||'')} (${ROLE_META[m.roles[m.lastDayEliminated]].name})`
      : '🤝 تعادل الأصوات — لم يخرج أحد.';
    control = `<button class="btn" onclick="mafiaNext('${code}','to_next_round')">الجولة التالية 🌙</button>`;
  } else if (m.phase==='ended'){
    narrator = m.winner==='mafia' ? '🔪 فازت المافيا!' : '🎉 فاز المواطنون!';
    control = `<button class="btn" onclick="resetToLobby('${code}')">لعبة جديدة 🔁</button>`;
  }

  const rolesHtml = Object.keys(players).map(id => {
    const dead = !m.alive[id];
    const rm = ROLE_META[m.roles[id]];
    return `<span class="chip ${dead?'dead':''}">${escapeHtml(players[id].name)} — ${rm?rm.icon+' '+rm.name:''}</span>`;
  }).join('');

  document.getElementById('stage').innerHTML = `
    <h2 style="font-family:'Cairo'; color:var(--accent);">من هم المافيا؟ 🕵️</h2>
    <p class="narrator">${narrator}</p>
    ${control}
    <div class="players-box">
      <h3 style="font-family:'Cairo'; font-size:14px; color:var(--text-dim);">شاشة الحكم — كل الأدوار</h3>
      <div>${rolesHtml}</div>
    </div>
  `;
}

/* ---- Mafia: player view ---- */
function renderMafiaPlayer(code, myId, name, room){
  const m = room.mafia; if (!m) return;
  const players = room.players || {};
  const myRole = m.roles[myId];
  const rm = ROLE_META[myRole];
  const iAmAlive = !!m.alive[myId];
  const aliveIds = Object.keys(m.alive||{}).filter(id=>m.alive[id]);

  const roleCard = `
    <div class="role-card ${rm.cls}">
      <div class="role-icon">${rm.icon}</div>
      <div class="role-name">${rm.name}</div>
      <div class="role-desc">${rm.desc}</div>
    </div>`;

  if (!iAmAlive){
    app.innerHTML = `<div class="phone"><div class="card">
      <h2 style="font-family:'Cairo';">💀 خرجت من اللعبة</h2>
      ${roleCard}
      <p class="muted">شاهد شاشة الحكم لمتابعة اللعبة.</p>
    </div></div>`;
    return;
  }

  if (m.phase==='role_reveal'){
    let extra = '';
    if (myRole==='mafia'){
      const mates = Object.keys(m.roles).filter(id=>m.roles[id]==='mafia' && id!==myId).map(id=>players[id]?.name).filter(Boolean);
      if (mates.length) extra = `<p class="muted">زملاؤك بالمافيا: ${mates.map(escapeHtml).join('، ')}</p>`;
    }
    app.innerHTML = `<div class="phone"><div class="card">${roleCard}${extra}<p class="muted">بانتظار بدء الحكم للجولة الأولى…</p></div></div>`;

  } else if (m.phase==='night_mafia'){
    if (myRole==='mafia'){
      const myVote = (m.nightVotes && m.nightVotes.mafia && m.nightVotes.mafia[myId]) || null;
      const targets = aliveIds.filter(id=>id!==myId && m.roles[id]!=='mafia');
      app.innerHTML = `<div class="phone"><div class="card">
        <h2 style="font-family:'Cairo';">🔪 اختر ضحية</h2>
        <div class="target-list">${targets.map(id=>`
          <button class="target-btn ${myVote===id?'picked':''}" onclick="mafiaVote('${code}','${myId}','${id}')">${escapeHtml(players[id].name)}</button>
        `).join('')}</div>
        ${myVote ? '<p class="muted">تم التصويت ✓ يمكنك تغيير رأيك</p>' : ''}
      </div></div>`;
    } else {
      app.innerHTML = `<div class="phone"><div class="card"><h2 style="font-family:'Cairo';">🌙 أغلق عينيك</h2><p class="muted">الجميع نائمون الآن…</p></div></div>`;
    }

  } else if (m.phase==='night_police'){
    if (myRole==='police'){
      const myResult = m.policeResults && m.policeResults[myId] && m.policeResults[myId].round===m.round ? m.policeResults[myId] : null;
      const targets = aliveIds.filter(id=>id!==myId);
      app.innerHTML = `<div class="phone"><div class="card">
        <h2 style="font-family:'Cairo';">👮 اختر من تحقق معه</h2>
        <div class="target-list">${targets.map(id=>`
          <button class="target-btn ${myResult && myResult.targetId===id?'picked':''}" onclick="policeInvestigate('${code}','${myId}','${id}')">${escapeHtml(players[id].name)}</button>
        `).join('')}</div>
        ${myResult ? `<p class="muted" style="font-size:16px; font-weight:700;">${escapeHtml(players[myResult.targetId].name)} ${myResult.isMafia ? 'هو من المافيا 🔴' : 'ليس من المافيا 🟢'}</p>` : ''}
      </div></div>`;
    } else {
      app.innerHTML = `<div class="phone"><div class="card"><h2 style="font-family:'Cairo';">🌙 أغلق عينيك</h2><p class="muted">الشرطي يحقق الآن…</p></div></div>`;
    }

  } else if (m.phase==='night_doctor'){
    if (myRole==='doctor'){
      const myProtect = m.nightVotes && m.nightVotes.doctorTarget;
      app.innerHTML = `<div class="phone"><div class="card">
        <h2 style="font-family:'Cairo';">⚕️ اختر من تحميه</h2>
        <div class="target-list">${aliveIds.map(id=>`
          <button class="target-btn ${myProtect===id?'picked':''}" onclick="doctorProtect('${code}','${id}')">${escapeHtml(players[id].name)}${id===myId?' (أنت)':''}</button>
        `).join('')}</div>
      </div></div>`;
    } else {
      app.innerHTML = `<div class="phone"><div class="card"><h2 style="font-family:'Cairo';">🌙 أغلق عينيك</h2><p class="muted">الطبيب يحمي أحدهم الآن…</p></div></div>`;
    }

  } else if (m.phase==='reveal'){
    const txt = m.lastNightVictim ? `💀 ${escapeHtml(players[m.lastNightVictim]?.name||'')} قُتل الليلة` : '✅ نجا الجميع الليلة!';
    app.innerHTML = `<div class="phone"><div class="card"><h2 style="font-family:'Cairo';">${txt}</h2><p class="muted">استعد للنقاش…</p></div></div>`;

  } else if (m.phase==='discussion'){
    app.innerHTML = `<div class="phone"><div class="card"><h2 style="font-family:'Cairo';">🗣️ وقت النقاش</h2><p class="muted">تكلم عندما يأتي دورك. سيبدأ التصويت قريبًا.</p></div></div>`;

  } else if (m.phase==='voting'){
    const myVote = m.dayVotes && m.dayVotes[myId];
    const targets = aliveIds.filter(id=>id!==myId);
    app.innerHTML = `<div class="phone"><div class="card">
      <h2 style="font-family:'Cairo';">🗳️ صوّت لإخراج أحد</h2>
      <div class="target-list">
        ${targets.map(id=>`<button class="target-btn ${myVote===id?'picked':''}" onclick="dayVote('${code}','${myId}','${id}')">${escapeHtml(players[id].name)}</button>`).join('')}
        <button class="target-btn ${myVote==='abstain'?'picked':''}" onclick="dayVote('${code}','${myId}','abstain')">امتناع عن التصويت</button>
      </div>
    </div></div>`;

  } else if (m.phase==='vote_reveal'){
    const txt = m.lastDayEliminated ? `🚪 تم إخراج ${escapeHtml(players[m.lastDayEliminated]?.name||'')}` : '🤝 تعادل — لم يخرج أحد';
    app.innerHTML = `<div class="phone"><div class="card"><h2 style="font-family:'Cairo';">${txt}</h2><p class="muted">الجولة التالية تبدأ قريبًا…</p></div></div>`;

  } else if (m.phase==='ended'){
    const allRoles = Object.keys(players).map(id=>`${escapeHtml(players[id].name)}: ${ROLE_META[m.roles[id]].icon} ${ROLE_META[m.roles[id]].name}`).join('<br>');
    app.innerHTML = `<div class="phone"><div class="card">
      <h2 style="font-family:'Cairo';">${m.winner==='mafia' ? '🔪 فازت المافيا!' : '🎉 فاز المواطنون!'}</h2>
      <p class="muted">${allRoles}</p>
    </div></div>`;
  }
}

/* ================= PLAYER (shared entry) ================= */
function renderPlayer(code){
  const roomRef = db.ref('rooms/' + code);
  let myId = localStorage.getItem('player_id_' + code);

  function attach(myId, name){
    roomRef.on('value', snap => {
      const room = snap.val();
      if (!room) { app.innerHTML = `<div class="phone"><div class="card"><h2 style="font-family:'Cairo';">انتهت الغرفة</h2><p class="muted">اطلب رابطًا جديدًا من المضيف.</p></div></div>`; return; }
      if (room.status === 'voting') renderPlayerVoting(code, myId, name, room);
      else if (room.status === 'in_game' && room.activeGame === 'mafia') renderMafiaPlayer(code, myId, name, room);
      else app.innerHTML = `<div class="phone"><div class="card"><h2 style="font-family:'Cairo';">🎮 اللعبة قيد التطوير</h2><p class="muted">انظر شاشة المضيف.</p></div></div>`;
    });
  }

  if (!myId) {
    app.innerHTML = `<div class="phone"><div class="card">
      <h2 style="font-family:'Cairo';">انضم للغرفة</h2>
      <input type="text" id="nameInput" placeholder="اكتب اسمك" maxlength="15" autofocus />
      <button class="btn" id="joinBtn" style="width:100%; margin-top:15px;">دخول</button>
    </div></div>`;
    document.getElementById('joinBtn').onclick = () => {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) return;
      const newId = roomRef.child('players').push().key;
      roomRef.child('players/' + newId).set({ name });
      localStorage.setItem('player_id_' + code, newId);
      attach(newId, name);
    };
  } else {
    roomRef.child('players/' + myId).once('value', snap => {
      if (snap.exists()) attach(myId, snap.val().name);
      else { localStorage.removeItem('player_id_' + code); renderPlayer(code); }
    });
  }
}

function renderPlayerVoting(code, myId, name, room){
  const myVote = room.votes ? room.votes[myId] : null;
  const cardsHtml = GAMES_LIST.map(g => {
    if (!g.available) return `<div class="game-card disabled"><div class="game-icon">${g.icon}</div><div class="game-title">${g.title}</div><div class="coming-soon">قريبًا</div></div>`;
    const sel = myVote === g.id;
    return `<div class="game-card ${sel?'selected':''}" onclick="castVote('${code}','${myId}','${g.id}')">
      <div class="game-icon">${g.icon}</div><div class="game-title">${g.title}</div>
      ${sel ? '<div class="vote-badge" style="background:var(--green);">صوتك ✓</div>' : '<div class="vote-badge">صوّت</div>'}
    </div>`;
  }).join('');

  app.innerHTML = `<div class="phone"><div class="card" style="max-width:480px;">
    <h2 style="font-family:'Cairo';">أهلاً ${escapeHtml(name)} 👋</h2>
    <p class="muted">صوّت للعبة التي تريد لعبها:</p>
    <div class="games-grid">${cardsHtml}</div>
    <p class="muted">بانتظار المضيف لبدء اللعبة…</p>
  </div></div>`;
}

window.castVote = function(code, myId, gameId){ db.ref('rooms/'+code+'/votes/'+myId).set(gameId); };
</script>
