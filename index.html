<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>منصة الألعاب - التصويت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<style>
  :root{
    --bg:#0f0c29;
    --surface:#1e1c2a;
    --accent:#667eea;
    --accent-2:#ff4d6d;
    --text:#f5f1e8;
    --text-dim:#a8a3b8;
    --green:#00b894;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; touch-action: manipulation;}
  body{
    margin:0; background: var(--bg); color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh;
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}
  
  /* Shared */
  .brand{ text-align:center; padding:18px 0 6px; font-size:15px; color:var(--text-dim); }
  .brand b{color:var(--accent); font-family:'Cairo',sans-serif;}
  .btn{
    font-family:'Cairo',sans-serif; font-weight:800; font-size:17px;
    border:none; border-radius:14px; padding:12px 24px; cursor:pointer;
    color:#fff; background:var(--accent); box-shadow:0 6px 0 #4a5db5;
    transition:transform .08s ease;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #4a5db5;}
  .btn:disabled{ background:#4a4658; color:#87829a; box-shadow:0 6px 0 #322f3d; cursor:default; }
  
  input[type=text]{
    font-family:'Tajawal',sans-serif; font-size:18px; padding:14px 16px;
    border-radius:12px; border:2px solid #3a3650; background:#100f17;
    color:var(--text); width:100%; outline:none; text-align:center;
  }

  /* Games Grid */
  .games-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 15px; width: 100%; max-width: 600px; margin-top: 20px;
  }
  .game-card {
    background: var(--surface); border: 2px solid #3a3650; border-radius: 16px;
    padding: 20px 10px; text-align: center; cursor: pointer; position: relative;
    transition: all 0.2s ease;
  }
  .game-card.disabled { opacity: 0.5; cursor: not-allowed; }
  .game-card.disabled:hover { transform: none; border-color: #3a3650; }
  .game-card:hover:not(.disabled) { border-color: var(--accent); transform: translateY(-3px); }
  .game-card.selected { border-color: var(--green); background: rgba(0, 184, 148, 0.1); }
  
  .game-icon { font-size: 40px; margin-bottom: 10px; }
  .game-title { font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 5px; }
  
  .vote-badge {
    background: var(--accent); color: #fff; font-size: 12px; font-weight: bold;
    padding: 4px 10px; border-radius: 20px; display: inline-block; margin-top: 10px;
  }
  .coming-soon { color: var(--accent-2); font-size: 12px; font-weight: bold; margin-top: 10px; }

  /* HOST */
  .stage{flex:1; display:flex; flex-direction:column; align-items:center; padding:24px 16px; text-align:center;}
  .room-code{ font-family:'Cairo',sans-serif; font-weight:900; font-size:48px; color:var(--accent); margin:0; }
  .join-row{ margin-top:22px; display:flex; gap:22px; align-items:center; background:var(--surface); padding:18px; border-radius:18px; }
  #qr{background:#fff; padding:8px; border-radius:10px; line-height:0;}
  .players-box{margin-top:30px; width:100%; max-width:600px;}
  .chip{ background:var(--surface); border:1px solid #3a3650; padding:9px 18px; border-radius:999px; font-weight:700; display:inline-block; margin:5px;}
  
  /* PLAYER */
  .phone{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
  .card{ background:var(--surface); border-radius:20px; padding:30px 24px; width:100%; max-width:400px; text-align:center; }
  .muted{color:var(--text-dim); font-size:14px; margin-top:10px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   1) إعدادات Firebase 
   ========================================================= */
const firebaseConfig = {
 apiKey: "AIzaSyBwU4coCgrk1kkzQUfj2vFh5kzoUlFzDnY",
  authDomain: "game-platform-v1.firebaseapp.com",
  databaseURL: "https://game-platform-v1-default-rtdb.firebaseio.com",
  projectId: "game-platform-v1",
  storageBucket: "game-platform-v1.firebasestorage.app",
  messagingSenderId: "1060382508222",
  appId: "1:1060382508222:web:b009f33dba05559806caef",
  measurementId: "G-0BR4SRYKH4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const app = document.getElementById('app');

// قائمة الألعاب المتاحة والمستقبلية
const GAMES_LIST = [
  { id: 'mafia', title: 'من هم المافيا؟', icon: '🕵️', available: true },
  { id: 'clicker', title: 'أسرع ضغطة', icon: '⚡', available: true },
  { id: 'draw', title: 'ارسم وخمن', icon: '🎨', available: false },
  { id: 'trivia', title: 'أسئلة وتحديات', icon: '🧠', available: false }
];

function makeRoomCode() { return String(Math.floor(1000 + Math.random()*9000)); }
function joinUrl(code) { return location.origin + location.pathname + '?room=' + code; }

const params = new URLSearchParams(location.search);
const roomParam = params.get('room');

if (!roomParam) { renderHost(); } else { renderPlayer(roomParam.trim()); }

/* ================= HOST (المنظم) ================= */
function renderHost(){
  const code = makeRoomCode();
  const roomRef = db.ref('rooms/' + code);
  
  // إنشاء الغرفة بوضع "التصويت"
  roomRef.set({ status: 'voting', players: {}, votes: {} });

  app.innerHTML = `
    <div class="brand">منصة <b>الألعاب</b></div>
    <div class="stage">
      <p style="margin:0; color:var(--text-dim);">رمز الغرفة</p>
      <p class="room-code">${code}</p>
      <div class="join-row"><div id="qr"></div></div>
      
      <div class="players-box">
        <h3 style="font-family:'Cairo';">الألعاب المتاحة للتصويت</h3>
        <div class="games-grid" id="hostGamesList"></div>
      </div>

      <div class="players-box" style="margin-top:20px;">
        <h3 style="font-family:'Cairo';">اللاعبون (<span id="count">0</span>)</h3>
        <div id="chips"></div>
      </div>
    </div>
  `;
  new QRCode(document.getElementById('qr'), { text: joinUrl(code), width: 120, height: 120 });

  // مراقبة اللاعبين
  roomRef.child('players').on('value', snap => {
    const players = snap.val() || {};
    const keys = Object.keys(players);
    document.getElementById('count').textContent = keys.length;
    document.getElementById('chips').innerHTML = keys.map(k => `<span class="chip">${players[k].name}</span>`).join('');
  });

  // مراقبة التصويت وعرض الألعاب للمنظم
  roomRef.child('votes').on('value', snap => {
    const votes = snap.val() || {};
    // حساب عدد الأصوات لكل لعبة
    const voteCounts = {};
    Object.values(votes).forEach(gameId => {
      voteCounts[gameId] = (voteCounts[gameId] || 0) + 1;
    });

    const gamesContainer = document.getElementById('hostGamesList');
    gamesContainer.innerHTML = GAMES_LIST.map(game => {
      const vCount = voteCounts[game.id] || 0;
      if (game.available) {
        return `
          <div class="game-card">
            <div class="game-icon">${game.icon}</div>
            <div class="game-title">${game.title}</div>
            <div class="vote-badge">${vCount} أصوات</div>
            <button class="btn" style="padding:6px 12px; font-size:14px; margin-top:10px; width:100%;" onclick="startSelectedGame('${game.id}', '${code}')">ابدأ اللعبة</button>
          </div>
        `;
      } else {
        return `
          <div class="game-card disabled">
            <div class="game-icon">${game.icon}</div>
            <div class="game-title">${game.title}</div>
            <div class="coming-soon">قريباً</div>
          </div>
        `;
      }
    }).join('');
  });
}

// دالة لبدء اللعبة التي يختارها المنظم
window.startSelectedGame = function(gameId, code) {
  const roomRef = db.ref('rooms/' + code);
  roomRef.child('status').set('playing_' + gameId);
  
  // تغيير شاشة المنظم حسب اللعبة
  document.querySelector('.stage').innerHTML = `
    <h2 style="font-family:'Cairo'; color:var(--accent); font-size:40px; margin-top:50px;">🎮 اللعبة بدأت!</h2>
    <p>يتم الآن تشغيل: ${GAMES_LIST.find(g => g.id === gameId).title}</p>
    <div class="muted">هنا ستظهر شاشة التحكم الخاصة باللعبة</div>
    <button class="btn btn-ghost" onclick="location.reload()" style="margin-top:40px;">إنهاء الجلسة</button>
  `;
};

/* ================= PLAYER (اللاعب) ================= */
function renderPlayer(code){
  const roomRef = db.ref('rooms/' + code);
  let myId = localStorage.getItem('player_id_' + code);

  if(!myId) {
    app.innerHTML = `
      <div class="phone">
        <div class="card">
          <h2 style="font-family:'Cairo';">انضم للغرفة</h2>
          <input type="text" id="nameInput" placeholder="اكتب اسمك" maxlength="15" autofocus />
          <button class="btn" id="joinBtn" style="width:100%; margin-top:15px;">دخول</button>
        </div>
      </div>
    `;
    document.getElementById('joinBtn').onclick = () => {
      const name = document.getElementById('nameInput').value.trim();
      if(name){
        myId = roomRef.child('players').push().key;
        roomRef.child('players/' + myId).set({ name: name });
        localStorage.setItem('player_id_' + code, myId);
        showPlayerVoting(code, roomRef, myId, name);
      }
    };
  } else {
    roomRef.child('players/' + myId).once('value', snap => {
      if(snap.exists()) showPlayerVoting(code, roomRef, myId, snap.val().name);
      else localStorage.removeItem('player_id_' + code); // الغرفة انتهت
    });
  }
}

function showPlayerVoting(code, roomRef, myId, name){
  // الاستماع لحالة الغرفة
  roomRef.on('value', snap => {
    const room = snap.val();
    if(!room) return;
    
    // شاشة التصويت
    if(room.status === 'voting'){
      const myVote = room.votes ? room.votes[myId] : null;
      
      const gamesHtml = GAMES_LIST.map(game => {
        if(game.available) {
          const isSelected = myVote === game.id ? 'selected' : '';
          return `
            <div class="game-card ${isSelected}" onclick="castVote('${code}', '${myId}', '${game.id}')">
              <div class="game-icon">${game.icon}</div>
              <div class="game-title">${game.title}</div>
              ${isSelected ? '<div class="vote-badge" style="background:var(--green);">صوتك ✓</div>' : '<div class="vote-badge" style="background:#3a3650;">صوّت</div>'}
            </div>
          `;
        } else {
          return `
            <div class="game-card disabled">
              <div class="game-icon">${game.icon}</div>
              <div class="game-title">${game.title}</div>
              <div class="coming-soon">قريباً</div>
            </div>
          `;
        }
      }).join('');

      app.innerHTML = `
        <div class="phone">
          <div class="card" style="max-width:500px;">
            <h2 style="font-family:'Cairo';">أهلاً ${name} 👋</h2>
            <p style="color:var(--text-dim); margin-bottom:20px;">اختر اللعبة التي تود لعبها لتصوت لها:</p>
            <div class="games-grid">
              ${gamesHtml}
            </div>
            <div class="muted" style="margin-top:20px;">بانتظار المنظم لبدء اللعبة...</div>
          </div>
        </div>
      `;
    } 
    // شاشة اللعب (تتغير حسب اللعبة المختارة)
    else if (room.status.startsWith('playing_')) {
      const gameId = room.status.split('_')[1];
      const gameTitle = GAMES_LIST.find(g => g.id === gameId)?.title;
      
      app.innerHTML = `
        <div class="phone">
          <div class="card">
            <h2 style="font-family:'Cairo'; color:var(--accent);">🎮 ${gameTitle}</h2>
            <p>انظر إلى شاشة المنظم!</p>
            <div class="muted">سيتم برمجة أزرار هذه اللعبة لاحقاً</div>
          </div>
        </div>
      `;
    }
  });
}

// دالة إرسال التصويت لقاعدة البيانات
window.castVote = function(code, myId, gameId) {
  const roomRef = db.ref('rooms/' + code);
  roomRef.child('votes/' + myId).set(gameId);
};
</script>
</body>
</html>
